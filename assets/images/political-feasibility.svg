    <g fill="#303a35"><text x="339" y="306">T0 · Voluntary</text><text x="339" y="352">T1 · Required</text><text x="339" y="398">T2 · Stop</text></g>
  </g>
  <g stroke="#698579" stroke-width="3"><path d="M555 300H794M555 322H794M555 344H794M555 366H794M555 388H794"/></g>
  <path d="M65 448H833" stroke="#b9b9ae"/>
  <text x="65" y="486" font-family="IBM Plex Sans, Arial, sans-serif" font-size="15" fill="#59615a">METHOD COMPANION · FORNBORG (2026)</text>
</svg>
