<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Power a datacenter (sketch)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#f4f0e9}
.tab{background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-size:15px;color:#56636a;padding:6px 0;cursor:pointer;min-height:36px}
.tab.on{color:#303d43;border-bottom-color:#4c7088}
.pill{background:none;border:0;border-radius:999px;font:inherit;font-size:13px;color:#56636a;padding:6px 12px;min-height:32px;cursor:pointer}
.pill.on{background:#f4f0e9;color:#303d43;box-shadow:0 0 0 1px rgba(76,112,136,0.19)}
.track{display:inline-flex;background:rgba(76,112,136,0.06);border-radius:999px;padding:3px;gap:2px}
.chip{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid rgba(76,112,136,0.19);border-radius:999px;font:inherit;font-size:13px;color:#303d43;padding:0 12px;height:32px;cursor:pointer}
.chip:hover{border-color:#4c7088}
.dot{width:8px;height:8px;border-radius:50%;background:#c9c3b6;display:block}
.dot.good{background:#5f8a64}
.dot.bad{background:#c4704c}
.info{width:22px;height:22px;border:1px solid #56636a;border-radius:50%;background:none;font:inherit;font-size:13px;line-height:1;color:#56636a;cursor:pointer;padding:0}
.play{width:40px;height:40px;border-radius:50%;border:0;background:#4c7088;color:#ffffff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.play:hover{background:#303d43}
.rb{width:28px;height:28px;border-radius:50%;border:1px solid rgba(76,112,136,0.19);background:none;font:inherit;font-size:15px;line-height:1;color:#303d43;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width: 760px){.chip{padding:0 9px;gap:6px}.rb{width:22px;height:22px;font-size:13px}}
.mob .mw{white-space:nowrap}
.rb:hover{border-color:#4c7088}
.rb:disabled{opacity:0.35;cursor:default}
.add{width:32px;height:32px;border-radius:50%;border:1px dashed #4c7088;background:none;color:#4c7088;font:inherit;font-size:15px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.add:hover{background:rgba(76,112,136,0.06)}
.sw{width:40px;height:24px;border-radius:12px;border:0;background:#c9c3b6;padding:3px;display:flex;justify-content:flex-start;cursor:pointer;flex:none}
.sw.on{background:#4c7088;justify-content:flex-end}
.knob{width:18px;height:18px;border-radius:50%;background:#f4f0e9;display:block}
.run{background:#4c7088;color:#ffffff;border:0;border-radius:999px;font:inherit;font-size:13px;padding:0 16px;height:32px;cursor:pointer}
.run:disabled{opacity:0.4;cursor:default}
.ov{position:absolute;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ctl{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap}
.lab{position:absolute;display:flex;flex-direction:column;line-height:1.3;font-size:13px;white-space:nowrap}
.name{color:#56636a}
.val{color:#303d43;font-weight:600;font-variant-numeric:tabular-nums}
.val.short{color:#b0532f}
.mw{font-size:13px;color:#303d43;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.flow{animation:flow 1s linear infinite}
.flow-rev{animation:flowrev 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes flowrev{to{stroke-dashoffset:26}}
.spin-slow{animation:spin 9s linear infinite}
.spin{animation:spin 4.5s linear infinite}
.spin-fast{animation:spin 2s linear infinite}
.spin-slow,.spin,.spin-fast{transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.flow,.flow-rev,.spin-slow,.spin,.spin-fast{animation:none}}
.chart{display:block;cursor:pointer}
.desk{display:block}
.mob{display:none}
@media (max-width: 760px){.desk{display:none}.mob{display:block}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(76,112,136,0.19);border-bottom:1px solid rgba(76,112,136,0.19)}
.fact{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-left:1px solid rgba(76,112,136,0.19);min-width:0}
.fact:first-child{border-left:0;padding-left:0}
.flab{font-size:13px;color:#56636a;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fval{font-size:20px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;color:#303d43}
@media (max-width: 760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(3){border-left:0;padding-left:0}.fact:nth-child(n+3){border-top:1px solid rgba(76,112,136,0.19)}}
.tick{display:flex;align-items:stretch;background:#303d43;color:#f4f0e9;border-radius:6px;overflow:hidden;font-size:13px;height:30px}
.tick-b{flex:none;display:flex;align-items:center;padding:0 10px;background:#b8322a;color:#ffffff;font-weight:600;letter-spacing:0.06em;font-size:11px}
.tick-w{flex:1;overflow:hidden;display:flex;align-items:center;min-width:0}
.tick-in{display:inline-flex;white-space:nowrap;animation:tick 30s linear infinite;will-change:transform}
.tick-in span{padding-right:64px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.tick{height:auto}.tick-in{animation:none;white-space:normal;padding:6px 0}.tick-in span+span{display:none}}
.mood{display:flex;align-items:center;gap:10px;font-size:13px}
.mood-bar{flex:1;height:12px;border-radius:6px;background:rgba(76,112,136,0.06);box-shadow:inset 0 0 0 1px rgba(76,112,136,0.19);display:flex;overflow:hidden}
.mood-seg{height:100%;border-right:1.5px solid #f4f0e9;box-sizing:border-box;transition:width .5s ease,background-color .5s ease}
.mood-w{font-weight:600;min-width:64px;text-align:right}
.dl{font-size:13px;color:#56636a;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.on{color:#303d43;font-weight:600}
.link{background:none;border:0;font:inherit;font-size:13px;color:#4c7088;padding:0;cursor:pointer}
</style>
</head>
<body>
<template id="dc-template">
<div style="background: #f4f0e9; color: #303d43; font-family: 'Avenir Next', 'Nunito Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; min-height: 100vh">
<svg width="0" height="0" style="position: absolute" aria-hidden="true"><defs>
<g id="p3tw"><path d="M-2,0 L2,0 L1,-108 L-1,-108 Z" fill="#59605b"/><rect x="-4.5" y="-113" width="9" height="6" rx="2" fill="#59605b"/></g>
<g id="p3blon"><path d="M0,0 L-2.8,-34 L0,-40 L2.8,-34 Z" fill="#4f7a96"/><path d="M0,0 L-2.8,-34 L0,-40 L2.8,-34 Z" fill="#4f7a96" transform="rotate(120)"/><path d="M0,0 L-2.8,-34 L0,-40 L2.8,-34 Z" fill="#4f7a96" transform="rotate(240)"/><circle r="3.5" fill="#59605b"/></g>
<g id="p3bloff"><path d="M0,0 L-2.8,-34 L0,-40 L2.8,-34 Z" fill="#24435a"/><path d="M0,0 L-2.8,-34 L0,-40 L2.8,-34 Z" fill="#24435a" transform="rotate(120)"/><path d="M0,0 L-2.8,-34 L0,-40 L2.8,-34 Z" fill="#24435a" transform="rotate(240)"/><circle r="3.5" fill="#59605b"/></g>
<g id="p3pv"><path d="M0,0 L58,0 L66,-16 L8,-16 Z" fill="#b18b5e"/><path d="M4,-8 L62,-8 M22,0 L30,-16 M40,0 L48,-16" stroke="#f4f0e9" stroke-width="0.9"/><path d="M14,0 L14,4 M50,0 L50,4" stroke="#59605b" stroke-width="1.5"/></g>
<g id="p3bc"><rect width="36" height="15" rx="2" fill="#5f7968"/><path d="M9,0 L9,15 M18,0 L18,15 M27,0 L27,15" stroke="#f4f0e9" stroke-width="0.9"/></g>
<g id="p3gs"><rect x="0" y="-44" width="8" height="44" fill="#8a7666"/><rect x="-1.5" y="-47" width="11" height="3.5" fill="#59605b"/></g>
<g id="p3nt"><path d="M-15,0 C-9,-24 -11,-40 -12.5,-62 L12.5,-62 C11,-40 9,-24 15,0 Z" fill="#e7e1d6" stroke="#7a6a8c" stroke-width="1.6"/></g>
</defs></svg>
<div style="max-width: 930px; margin: 0 auto; padding: 28px 20px 48px; display: flex; flex-direction: column; gap: 18px">

<h1 style="margin: 0; font-size: 26px; font-weight: 500; line-height: 1.25">Power a datacenter</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<button type="button" class="play" aria-label="{{playLabel}}" onClick="{{togglePlay}}"><sc-if value="{{isPaused}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display: block"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg></sc-if><sc-if value="{{isPlaying}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display: block"><rect x="6.5" y="5" width="3.6" height="14" rx="1" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1" fill="currentColor"/></svg></sc-if></button>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; width: 112px">{{hourDate}}, {{hourTime}}</span>
<div style="display: flex; align-items: center; gap: 18px; margin-left: auto" role="group" aria-label="Month"><sc-for list="{{monthButtons}}" as="b" hint-placeholder-count="2"><button type="button" class="{{b.cls}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">{{b.label}}</button></sc-for><button type="button" class="info" aria-label="Why the months differ" aria-expanded="{{showInfo}}" onClick="{{toggleInfo}}">i</button></div>
</div>
<sc-if value="{{showInfo}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; line-height: 1.5; color: #56636a">January: strong wind, little sun. July: less wind, more sun. The datacenter uses about 7 % more in July, for cooling.</p></sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column">
<svg class="chart" viewBox="0 0 360 34" width="100%" height="26" preserveAspectRatio="none" role="img" aria-label="The whole month. Select a point to move there." onClick="{{onOverview}}" style="background: rgba(76,112,136,0.06); border-radius: 6px">
<path d="{{overview}}" fill="#b5c9d6"></path>
<path d="{{ovLoad}}" fill="none" stroke="#303d43" stroke-width="1" stroke-opacity="0.7" vector-effect="non-scaling-stroke"></path>
<rect x="{{winX}}" y="0.5" width="{{winW}}" height="33" fill="none" stroke="#4c7088" stroke-width="1.2" vector-effect="non-scaling-stroke"></rect>
<line x1="{{ovX}}" x2="{{ovX}}" y1="0" y2="34" stroke="#303d43" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
</svg>
<svg viewBox="0 0 360 14" width="100%" height="14" preserveAspectRatio="none" aria-hidden="true" style="display: block"><polygon points="{{zoomPts}}" fill="#4c7088" fill-opacity="0.08"></polygon></svg>
<svg class="chart" viewBox="0 0 360 160" width="100%" height="120" preserveAspectRatio="none" role="img" aria-label="Supply by source against datacenter use, one week. Select a point to move there." onClick="{{onWindow}}" style="background: rgba(76,112,136,0.06); border-radius: 6px"><path d="{{chart.mid}}" stroke="rgba(76,112,136,0.19)" stroke-width="1" vector-effect="non-scaling-stroke"></path><path d="{{chart.paths.deficit}}" fill="{{deficitColor}}"></path><path d="{{chart.paths.nuclear}}" fill="#7a6a8c"></path><path d="{{chart.paths.onwind}}" fill="#4f7a96"></path><path d="{{chart.paths.offwind}}" fill="#24435a"></path><path d="{{chart.paths.solar}}" fill="#b18b5e"></path><path d="{{chart.paths.battery}}" fill="#5f7968"></path><path d="{{chart.paths.gas}}" fill="#8a7666"></path><path d="{{chart.paths.load}}" fill="none" stroke="#303d43" stroke-width="1.5" vector-effect="non-scaling-stroke"></path><path d="{{chart.ticks}}" stroke="#56636a" stroke-opacity="0.5" stroke-width="1" vector-effect="non-scaling-stroke"></path><line x1="{{playX}}" x2="{{playX}}" y1="0" y2="160" stroke="#303d43" stroke-width="1.5" vector-effect="non-scaling-stroke"></line></svg><div style="position: relative; height: 20px; overflow: hidden"><sc-for list="{{days}}" as="dd" hint-placeholder-count="7"><span class="{{dd.cls}}" style="position: absolute; top: 3px; transform: translateX(-50%); {{dd.left}}">{{dd.label}}</span></sc-for></div>
</div>
</sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<button type="button" class="chip" aria-expanded="{{ruleOpen}}" onClick="{{toggleRule}}"><span class="{{dotCls}}"></span>Rule: {{ruleText}}</button>
<button type="button" class="chip" aria-expanded="{{optOpen}}" onClick="{{toggleOpt}}">Find mix</button>
<button type="button" class="chip" aria-expanded="{{showStatus}}" onClick="{{toggleStatus}}"><span class="dot" style="background: {{mood.color}}"></span>Status</button>
<sc-if value="{{ruleOpen}}" hint-placeholder-val="{{ false }}"><div class="track" role="group" aria-label="Policy rule"><sc-for list="{{matchingButtons}}" as="b" hint-placeholder-count="3"><button type="button" class="{{b.cls}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">{{b.label}}</button></sc-for></div></sc-if>
<sc-if value="{{showShare}}" hint-placeholder-val="{{ false }}"><div class="track" role="group" aria-label="Required share"><sc-for list="{{shareButtons}}" as="b" hint-placeholder-count="3"><button type="button" class="{{b.cls}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">{{b.label}}</button></sc-for></div></sc-if>
<sc-if value="{{optOpen}}" hint-placeholder-val="{{ false }}"><div class="track" role="group" aria-label="Which plants"><sc-for list="{{setButtons}}" as="b" hint-placeholder-count="3"><button type="button" class="{{b.cls}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">{{b.label}}</button></sc-for></div><button type="button" class="run" disabled="{{cantRun}}" onClick="{{runOpt}}">{{runLabel}}</button><span style="font-size: 13px">{{optMsg}}</span></sc-if>
</div>

<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; color: #56636a">Loading…</p></sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<sc-if value="{{showStatus}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 8px">
<div class="tick" role="status"><span class="tick-b">STATUS</span><div class="tick-w"><span class="tick-in" style="animation-duration: {{ticker.dur}}"><span>{{ticker.text}}</span><span aria-hidden="true">{{ticker.text}}</span></span></div></div>
<div class="mood"><span class="name">Public anger</span><div class="mood-bar" role="meter" aria-label="Public anger" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{mood.pct}}"><sc-for list="{{mood.segs}}" as="sg" hint-placeholder-count="3"><span class="mood-seg" style="{{sg.style}}" title="{{sg.title}}"></span></sc-for></div><span class="mood-w" style="color: {{mood.color}}">{{mood.word}}</span></div>
<span style="font-size: 13px; color: #56636a; margin-top: -4px">Angry: {{mood.legend}}</span>
</div></sc-if>
<div class="desk" style="position: relative; width: 100%">
<svg viewBox="0 0 900 470" width="100%" style="display: block" role="img" aria-label="The datacenter in the middle, new plants around it, with electricity flowing in this hour">
<rect x="0" y="205" width="900" height="40" fill="#ebe6dc"/><rect x="0" y="430" width="900" height="40" fill="#ebe6dc"/>
<rect x="20" y="40" width="155" height="165" rx="10" fill="#4f7a96" fill-opacity="0.07" stroke="#4f7a96" stroke-opacity="0.3" stroke-dasharray="{{tiles.onwind.dash}}"/><svg x="20" y="40" width="155" height="165" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="0" y="{{tiles.onwind.fillY}}" width="100" height="{{tiles.onwind.fill}}" fill="#4f7a96" fill-opacity="0.18"/></svg>
<rect x="185" y="40" width="145" height="165" rx="10" fill="#b18b5e" fill-opacity="0.07" stroke="#b18b5e" stroke-opacity="0.3" stroke-dasharray="{{tiles.solar.dash}}"/><svg x="185" y="40" width="145" height="165" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="0" y="{{tiles.solar.fillY}}" width="100" height="{{tiles.solar.fill}}" fill="#b18b5e" fill-opacity="0.18"/></svg>
<rect x="570" y="40" width="150" height="165" rx="10" fill="#7a6a8c" fill-opacity="0.07" stroke="#7a6a8c" stroke-opacity="0.3" stroke-dasharray="{{tiles.nuclear.dash}}"/><svg x="570" y="40" width="150" height="165" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="0" y="{{tiles.nuclear.fillY}}" width="100" height="{{tiles.nuclear.fill}}" fill="#7a6a8c" fill-opacity="0.18"/></svg>
<rect x="730" y="40" width="150" height="165" rx="10" fill="#24435a" fill-opacity="0.07" stroke="#24435a" stroke-opacity="0.3" stroke-dasharray="{{tiles.offwind.dash}}"/><svg x="730" y="40" width="150" height="165" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="0" y="{{tiles.offwind.fillY}}" width="100" height="{{tiles.offwind.fill}}" fill="#24435a" fill-opacity="0.18"/></svg>
<rect x="20" y="265" width="155" height="165" rx="10" fill="rgba(76,112,136,0.06)" stroke="rgba(76,112,136,0.19)"/>
<rect x="185" y="265" width="145" height="165" rx="10" fill="#5f7968" fill-opacity="0.07" stroke="#5f7968" stroke-opacity="0.3" stroke-dasharray="{{tiles.battery.dash}}"/><svg x="185" y="265" width="145" height="165" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="0" y="{{tiles.battery.fillY}}" width="100" height="{{tiles.battery.fill}}" fill="#5f7968" fill-opacity="0.18"/></svg>
<rect x="570" y="265" width="150" height="165" rx="10" fill="#8a7666" fill-opacity="0.07" stroke="#8a7666" stroke-opacity="0.3" stroke-dasharray="{{tiles.gas.dash}}"/><svg x="570" y="265" width="150" height="165" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="0" y="{{tiles.gas.fillY}}" width="100" height="{{tiles.gas.fill}}" fill="#8a7666" fill-opacity="0.18"/></svg>
<line x1="30" y1="160" x2="165" y2="160" stroke="#cdc6b9"/>
<g transform="translate(44,160) scale(0.46)" opacity="{{tiles.onwind.vis.s1}}"><use href="#p3tw"/><g transform="translate(0,-110)"><g transform="rotate({{rot.onwind}})"><use href="#p3blon"/></g></g></g><g transform="translate(76,160) scale(0.46)" opacity="{{tiles.onwind.vis.s2}}"><use href="#p3tw"/><g transform="translate(0,-110)"><g transform="rotate({{rot.onwind}})"><use href="#p3blon"/></g></g></g><g transform="translate(108,160) scale(0.46)" opacity="{{tiles.onwind.vis.s3}}"><use href="#p3tw"/><g transform="translate(0,-110)"><g transform="rotate({{rot.onwind}})"><use href="#p3blon"/></g></g></g><g transform="translate(140,160) scale(0.46)" opacity="{{tiles.onwind.vis.s4}}"><use href="#p3tw"/><g transform="translate(0,-110)"><g transform="rotate({{rot.onwind}})"><use href="#p3blon"/></g></g></g>
<line x1="195" y1="160" x2="320" y2="160" stroke="#cdc6b9"/>
<use href="#p3pv" x="198" y="138" opacity="{{tiles.solar.vis.s3}}"/>
<use href="#p3pv" x="256" y="138" opacity="{{tiles.solar.vis.s4}}"/>
<use href="#p3pv" x="192" y="160" opacity="{{tiles.solar.vis.s1}}"/>
<use href="#p3pv" x="250" y="160" opacity="{{tiles.solar.vis.s2}}"/>
<line x1="580" y1="160" x2="710" y2="160" stroke="#cdc6b9"/>
<g opacity="{{tiles.nuclear.vis.s1}}"><g transform="translate(605,160) scale(0.85)"><use href="#p3nt"/></g><ellipse cx="605" cy="100" rx="11" ry="4.5" fill="#ffffff" opacity="{{steam}}"/></g>
<g opacity="{{tiles.nuclear.vis.s2}}"><g transform="translate(645,160) scale(0.85)"><use href="#p3nt"/></g><ellipse cx="645" cy="100" rx="11" ry="4.5" fill="#ffffff" opacity="{{steam}}"/></g>
<g opacity="{{tiles.nuclear.vis.s3}}"><g transform="translate(685,160) scale(0.85)"><use href="#p3nt"/></g><ellipse cx="685" cy="100" rx="11" ry="4.5" fill="#ffffff" opacity="{{steam}}"/></g>
<rect x="740" y="148" width="130" height="14" rx="3" fill="#dde4e5"/>
<g transform="translate(770,156) scale(0.4)" opacity="{{tiles.offwind.vis.s1}}"><use href="#p3tw"/><g transform="translate(0,-110)"><g transform="rotate({{rot.offwind}})"><use href="#p3bloff"/></g></g></g><g transform="translate(805,156) scale(0.4)" opacity="{{tiles.offwind.vis.s2}}"><use href="#p3tw"/><g transform="translate(0,-110)"><g transform="rotate({{rot.offwind}})"><use href="#p3bloff"/></g></g></g><g transform="translate(840,156) scale(0.4)" opacity="{{tiles.offwind.vis.s3}}"><use href="#p3tw"/><g transform="translate(0,-110)"><g transform="rotate({{rot.offwind}})"><use href="#p3bloff"/></g></g></g>
<line x1="30" y1="385" x2="165" y2="385" stroke="#cdc6b9"/>
<g opacity="{{gridTile.pylon}}" transform="translate(0,-85)"><path d="M89,470 L97,385 L105,470 M91,445 L103,445 M93,420 L101,420 M90,460 L104,430 M104,460 L90,430 M93,405 L101,395" fill="none" stroke="#59605b" stroke-width="1.4"/><path d="M78,392 L116,392 M82,404 L112,404" stroke="#59605b" stroke-width="1.5"/><path d="M78,392 L40,380 M116,392 L160,378" stroke="#59605b" stroke-width="0.9" opacity="0.6"/></g>

<script>
// Small runtime that renders a .dc.html template in a plain web page.
// Supports {{a.b}} holes in text and attributes, <sc-if value>, <sc-for list as>,
// onClick handlers and setState. Re-renders by morphing the live DOM in place.
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('dc-root');
  const tree = tpl.content;
  const HOLE = /\{\{\s*([^}]*?)\s*\}\}/g;
  const ONE = /^\{\{\s*([^}]*?)\s*\}\}$/;

  function look(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    let v = scope;
    for (const k of path.split('.')) {
      if (v == null) return undefined;
      v = v[k];
    }
    return v;
  }
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const sub = (str, scope) => str.replace(HOLE, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); });

  let handlers = [];
  function attrs(el, scope) {
    let out = '';
    for (const a of el.attributes) {
      const name = a.name;
      if (name.startsWith('hint-')) continue;
      const m = a.value.match(ONE);
      if (m) {
        const v = look(scope, m[1]);
        if (/^on[A-Z]?[a-z]+$/i.test(name)) {
          if (typeof v === 'function') { handlers.push(v); out += ' data-dc-' + name.slice(2).toLowerCase() + '="' + (handlers.length - 1) + '"'; }
          continue;
        }
        if (name.startsWith('aria-')) { out += ' ' + name + '="' + esc(v == null ? '' : v) + '"'; continue; }
        if (v === false || v == null) continue;
        out += ' ' + name + '="' + (v === true ? '' : esc(v)) + '"';
        continue;
      }
      out += ' ' + name + '="' + esc(sub(a.value, scope)) + '"';
    }
    return out;
  }
  const VOID = new Set(['br', 'hr', 'img', 'input', 'link', 'meta', 'source', 'area', 'col', 'wbr']);
  function kids(node, scope) {
    let s = '';
    for (const ch of node.childNodes) s += render(ch, scope);
    return s;
  }
  function render(node, scope) {
    if (node.nodeType === 3) return esc(sub(node.nodeValue, scope));
    if (node.nodeType !== 1) return '';
    const tag = node.localName;
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value') || '').match(ONE);
      return m && look(scope, m[1]) ? kids(node, scope) : '';
    }
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list') || '').match(ONE);
      const list = (m && look(scope, m[1])) || [];
      const as = node.getAttribute('as') || 'item';
      let s = '';
      for (let i = 0; i < list.length; i++) s += kids(node, Object.assign(Object.create(scope), { [as]: list[i] }));
      return s;
    }
    const open = '<' + tag + attrs(node, scope) + '>';
    if (VOID.has(tag)) return open;
    return open + kids(node, scope) + '</' + tag + '>';
  }

  function morph(a, b) {
    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
    if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    if (a.nodeType !== 1) return;
    for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of b.attributes) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    const ak = a.childNodes, bk = [...b.childNodes];
    let i = 0;
    for (; i < bk.length; i++) {
      if (i < ak.length) morph(ak[i], bk[i]);
      else a.appendChild(bk[i]);
    }
    while (ak.length > bk.length) a.removeChild(a.lastChild);
  }

  window.DCLogic = class {
    constructor() { this.state = {}; }
    setState(p) { Object.assign(this.state, p); schedule(); }
  };
  let comp, queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; paint(); });
  }
  const scratch = document.createElement('div');
  function paint() {
    handlers = [];
    let vals = {};
    try { vals = comp.renderVals() || {}; } catch (e) { console.error(e); }
    scratch.innerHTML = kids(tree, vals);
    if (!root.firstChild) { while (scratch.firstChild) root.appendChild(scratch.firstChild); }
    else {
      const ak = root.childNodes, bk = [...scratch.childNodes];
      for (let i = 0; i < bk.length; i++) { if (i < ak.length) morph(ak[i], bk[i]); else root.appendChild(bk[i]); }
      while (ak.length > bk.length) root.removeChild(root.lastChild);
    }
    current = handlers;
  }
  let current = [];
  root.addEventListener('click', (e) => {
    const el = e.target.closest('[data-dc-click]');
    if (!el || !root.contains(el)) return;
    const f = current[+el.getAttribute('data-dc-click')];
    if (f) f(e);
  });
  window.__dcStart = function (Component) {
    comp = new Component();
    paint();
    if (comp.componentDidMount) comp.componentDidMount();
  };
})();

class Component extends DCLogic {
  componentDidMount() {

  meta() {

        onwind: { label: 'Onshore wind', color: '#4f7a96', step: 50, max: 3000, first: 200, unit: 200, slots: 5 },
        solar: { label: 'Solar', color: '#b18b5e', step: 50, max: 3000, first: 250, unit: 250, slots: 4 },
        offwind: { label: 'Offshore wind', color: '#24435a', step: 50, max: 2000, first: 250, unit: 250, slots: 4 },
        nuclear: { label: 'Nuclear', color: '#7a6a8c', step: 50, max: 1200, first: 300, unit: 300, slots: 3 },
        battery: { label: 'Battery', color: '#5f7968', step: 25, max: 800, first: 100, unit: 100, slots: 6 },
        gas: { label: 'Gas', color: '#8a7666', step: 25, max: 600, first: 100, unit: 100, slots: 6 }
      },
      gas: { capital: 56876, co2: 0.477 },

      dcMW: 300,
      win: 168,
      months: { jan: 'January', jul: 'July' },

  }

  cfg() {

    return {
      month: s.month || 'jan',
      matching: s.matching || 'hourly',
      share: s.share || 100,
      grid: s.grid || 'off',
      mw: s.mw || { onwind: 0, solar: 0, offwind: 0, nuclear: 0, battery: 0, gas: 0 },
      batH: s.batH || 4
    };
  }

  fmt(x, d) {
    return Number(x).toLocaleString('en-US', { maximumFractionDigits: d || 0, minimumFractionDigits: d || 0 });
  }

  simMonth(data, c, M, key) {
    const m = data.months[key];
    const n = m.load.length;
    const P = c.mw.battery, E = P * c.batH, eta = data.battery.efficiency_one_way;
    const grid = c.grid === 'on';
    let soc = E / 2;
    const r = { load: [], gen: {}, dis: [], ch: [], soc: [], gas: [], imp: [], exp: [], uns: [], curt: [], stack: [] };
    M.clean.forEach((k) => { r.gen[k] = []; });
    const sum = { load: 0, clean: 0, gas: 0, imp: 0, uns: 0, unsHours: 0, maxImp: 0, maxExp: 0 };
    for (let t = 0; t < n; t++) {
      const load = M.dcMW * m.load[t];
      let G = 0;
      M.clean.forEach((k) => { const g = c.mw[k] * (k === 'nuclear' ? 1 : m[k][t]); r.gen[k].push(g); G += g; });
      let dis = 0, ch = 0, gas = 0, imp = 0, exp = 0, uns = 0, curt = 0;
      if (G >= load) {
        ch = Math.max(0, Math.min(G - load, P, E > 0 ? (E - soc) / eta : 0));
        soc += ch * eta;
        const rest = G - load - ch;
        if (grid) exp = rest; else curt = rest;
      } else {
        let need = load - G;
        dis = Math.max(0, Math.min(need, P, soc * eta));
        soc -= dis / eta;
        need -= dis;
        gas = Math.min(need, c.mw.gas);
        need -= gas;
        if (grid) imp = need; else uns = need;

      r.load.push(load); r.dis.push(dis); r.ch.push(ch); r.soc.push(E > 0 ? soc / E : 0); r.gas.push(gas);
      r.imp.push(imp); r.exp.push(exp); r.uns.push(uns); r.curt.push(curt); r.stack.push(G + dis + gas);
      sum.load += load; sum.clean += Math.min(G, load) + dis; sum.gas += gas;
      if (uns > 0.5) sum.unsHours += 1;
      sum.imp += imp; sum.uns += uns; sum.maxImp = Math.max(sum.maxImp, imp); sum.maxExp = Math.max(sum.maxExp, exp);

      } else {
        const nightLen = rise >= 0 ? 24 - (sset - rise) : 24;
        const t = rise >= 0 ? ((hd - sset + 24) % 24) / nightLen : hd / 24;
        const col = '#39444e';
        out.sky = { color: col, starOp: '0.85', sunOp: '0', sunX: '-50', sunY: '40', moonOp: '1', moonX: (392 + t * 116).toFixed(1), moonY: (120 - Math.sin(Math.PI * t) * 20).toFixed(1), moonCut: col };
      }
      out.sky.moonCutX = (parseFloat(out.sky.moonX) + 2.5).toFixed(1);
      out.sky.moonCutY = (parseFloat(out.sky.moonY) - 2).toFixed(1); out.sky.nightOp = (0.22 * (1 - Math.min(1, parseFloat(out.sky.starOp) > 0.5 ? 0 : 1))).toFixed(2);
    }
    const load = at(r.load);
    flows.dc = flow(load - at(r.uns), true, false);
    const cleanDirect = load - at(r.dis) - at(r.gas) - at(r.imp) - at(r.uns);
    let x0 = 0;
    const bseg = (v) => { const w = Math.max(0, (v / load) * 100); const o = { x: x0.toFixed(1), w: w.toFixed(1) }; x0 += w; return o; };
    out.bar = { clean: bseg(cleanDirect), battery: bseg(at(r.dis)), gas: bseg(at(r.gas)), grid: bseg(at(r.imp)), short: bseg(at(r.uns)) };
    {
      const served = load - at(r.uns), f = load > 0 ? served / load : 0;
      const op = (0.35 + 0.65 * f).toFixed(2);
      out.dc = f < 0.02
        ? { now: 'Off', cls: 'val short', led: '#59605b', op: op }
        : f < 0.98
          ? { now: this.fmt(served) + ' MW', cls: 'val short', led: '#e2b763', op: op }
          : { now: this.fmt(served) + ' MW', cls: 'val', led: '#a9cdb0', op: '1' };
    }

    const hourlyShare = r.sum.clean / r.sum.load;
    let annualMW = 0;
    M.clean.forEach((k) => { annualMW += c.mw[k] * (k === 'nuclear' ? 1 : data.annual_cf[k]); });
    const annualShare = annualMW / M.dcMW;
    if (c.matching !== 'none') {
      const shown = c.matching === 'annual' ? annualShare : hourlyShare;
      const meets = shown >= c.share / 100 - 0.0005;
      out.ruleText = (c.matching === 'annual' ? 'Annual' : 'Hourly') + ' ' + c.share + ' %';
      out.dotCls = meets ? 'dot good' : 'dot bad';
    }
    let cost = 0;
    M.clean.forEach((k) => { cost += c.mw[k] * data.capital_cost_eur_per_mw_year[k]; });
    cost += c.mw.nuclear * 8760 * M.nuclearVar;
    cost += c.mw.battery * data.battery.power_eur_per_mw_year + c.mw.battery * c.batH * data.battery.energy_eur_per_mwh_year + c.mw.gas * M.gas.capital;
    const conn = Math.max(d.jan.sum.maxImp, d.jan.sum.maxExp, d.jul.sum.maxImp, d.jul.sum.maxExp);
    const mon = M.short[c.month];
    const stats = [
      { label: c.matching === 'annual' ? 'Use matched over the year' : 'Use matched each hour', value: pct(c.matching === 'annual' ? annualShare : hourlyShare) },
      grid ? { label: 'Grid connection needed', value: this.fmt(conn) + ' MW' } : { label: 'Hours throttled', value: String(r.sum.unsHours) },
      { label: 'Yearly cost of new plants', value: this.fmt(cost / 1e6) + ' M€' },
      { label: 'CO2 from gas', value: this.fmt(r.sum.gas * M.gas.co2 / 1000, 1) + ' kt' }
    ];
    out.stats = stats;

    // Game layer: a made-up anger meter and a status ticker. Not model results.
    {
      const nh = r.load.length;
      const sumOf = (a) => a.reduce((x, y) => x + y, 0);
      const servedShare = 1 - r.sum.uns / r.sum.load;
      const unsShare = r.sum.uns / r.sum.load;
      const parts = [
        { label: 'Wind turbine neighbours', v: c.mw.onwind / 20 },
        { label: 'Fishermen', v: c.mw.offwind / 40 },
        { label: 'Farmers', v: c.mw.solar / 40 },
        { label: 'Nuclear sceptics', v: c.mw.nuclear / 30 },
        { label: 'Climate activists', v: (r.sum.gas * M.gas.co2 / 1000) / 2 },
        { label: 'Neighbours with higher power bills', v: (r.sum.imp / nh) / 3 },
        { label: 'Your customers', v: servedShare > 0.02 ? unsShare * 60 : 0 },
        { label: 'Your CFO', v: cost / 1e6 / 6 }
      ].filter((p) => p.v >= 0.5).sort((a, b) => b.v - a.v);
      const total = parts.reduce((x, p) => x + p.v, 0);
      const scale = total > 100 ? 100 / total : 1;
      const mix = (a, b, f) => { const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * f).toString(16).padStart(2, '0')).join(''); };
      const tt = Math.min(1, total / 100);
      const color = tt < 0.5 ? mix('#e2b763', '#d9894f', tt * 2) : mix('#d9894f', '#b8322a', (tt - 0.5) * 2);
      const word = total < 10 ? 'Calm' : total < 35 ? 'Grumbling' : total < 65 ? 'Annoyed' : total < 100 ? 'Angry' : 'Furious';
      out.mood = {
        segs: parts.map((p) => ({ style: 'width: ' + (p.v * scale).toFixed(2) + '%; background: ' + color, title: p.label })),
        word: word, color: color, pct: Math.min(100, total).toFixed(0),
        legend: parts.length ? parts.slice(0, 3).map((p) => p.label).join(', ') + (parts.length > 3 ? ' and others' : '') : 'Nobody, yet'
      };

      const anyPlant = Object.keys(M.t).some((k) => c.mw[k] > 0);
      const msgs = [];
      if (!anyPlant && !grid) {
        msgs.push('No power. Your datacenter needs electricity to run. Build something or plug into the grid.');
      } else {
        if (servedShare < 0.02) msgs.push('Your datacenter is dark. Nothing is running.');
        else if (unsShare > 0.5) msgs.push('Your datacenter is throttled most of the time, ' + pct(unsShare) + ' of the work is cut. Customers are leaving.');
        else if (unsShare > 0.005) msgs.push('Your datacenter throttles when power runs short. ' + pct(unsShare) + ' of the work is cut.');
        else msgs.push('Your datacenter runs at full speed.');
        const renGen = ['onwind', 'offwind', 'solar'].reduce((x, k) => x + sumOf(r.gen[k]), 0);
        const nucGen = sumOf(r.gen.nuclear);
        if (r.sum.imp / r.sum.load > 0.5) msgs.push('Mostly running on the grid. Your neighbours’ electricity bills just went up.');
        else if (r.sum.gas / r.sum.load > 0.3) msgs.push('Burning gas. Cheap and reliable, but the climate disagrees.');
        else if (nucGen > renGen && nucGen > 0) msgs.push('Nuclear baseload. Steady power, and a bill your CFO will remember.');
        else if (renGen > 0) msgs.push(total >= 65 ? 'You are running your datacenter cheaply on renewables, but people are pissed off about it.' : 'Running on wind and sun. So far people put up with it.');
        if (c.matching !== 'none') {
          const shown = c.matching === 'annual' ? annualShare : hourlyShare;
          const name = (c.matching === 'annual' ? 'Annual' : 'Hourly') + ' ' + c.share + ' % rule';
          msgs.push(shown >= c.share / 100 - 0.0005 ? name + ' met.' : name + ' not met, ' + this.fmt(Math.floor(shown * 1000) / 10, 1) + ' % matched.');
        }
        if (total >= 100) msgs.push('The public is furious. Expect protests outside the fence.');
        else if (total >= 65) msgs.push(parts[0].label + ' are getting angry.');
        else if (total < 10 && servedShare > 0.5) msgs.push('Nobody is complaining. Suspicious.');
      }
      const text = msgs.join('   •   ');
      out.ticker = { text: text, dur: Math.max(12, text.length * 0.16).toFixed(1) + 's' };
    }

    const hourF = hour + fr;
    const startF = Math.min(n - M.win, Math.floor(hour / M.win) * M.win);
    this._startF = startF;
    out.chart = this.smoothChart(r, startF, M);
    out.playX = (((hourF - startF) * 360) / (M.win - 1)).toFixed(1);
    out.topLabel = '1,000 MW';
    out.overview = d.overview;
    out.ovLoad = d.ovLoad;
    out.winX = ((startF * 360) / (n - 1)).toFixed(1);
    out.winW = (((M.win - 1) * 360) / (n - 1)).toFixed(1);
    {
      const wx = (startF * 360) / (n - 1), ww = ((M.win - 1) * 360) / (n - 1);
      out.zoomPts = wx.toFixed(1) + ',0 ' + (wx + ww).toFixed(1) + ',0 360,14 0,14';
    }
    const days = [];
    for (let dd = Math.floor(startF / 24); dd * 24 <= startF + M.win; dd++) {
      const c12 = dd * 24 + 12;
      const xp = ((c12 - startF) / (M.win - 1)) * 100;
      if (xp < 3 || xp > 97 || dd > 30) continue;
      days.push({ label: M.short[c.month] + ' ' + (dd + 1), left: 'left: ' + xp.toFixed(2) + '%', cls: dd === Math.floor(hour / 24) ? 'dl on' : 'dl' });
    }
    out.days = days;
    out.ovX = ((hourF * 360) / (n - 1)).toFixed(1);
    return out;
  }
}
window.__dcStart(Component);
</script>
