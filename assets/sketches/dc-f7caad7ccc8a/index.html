<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Power a datacenter (sketch)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#f4f0e9}
.tab{background:none;border:0;border-bottom:2px solid transparent;font:inherit;font-size:15px;color:#56636a;padding:6px 0;cursor:pointer;min-height:36px}
.tab.on{color:#303d43;border-bottom-color:#4c7088}
.pill{background:none;border:0;border-radius:999px;font:inherit;font-size:13px;color:#56636a;padding:6px 12px;min-height:32px;cursor:pointer}
.pill.on{background:#f4f0e9;color:#303d43;box-shadow:0 0 0 1px rgba(76,112,136,0.19)}
.track{display:inline-flex;background:rgba(76,112,136,0.06);border-radius:999px;padding:3px;gap:2px}
.chip{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid rgba(76,112,136,0.19);border-radius:999px;font:inherit;font-size:13px;color:#303d43;padding:0 12px;height:32px;cursor:pointer}
.chip:hover{border-color:#4c7088}
.dot{width:8px;height:8px;border-radius:50%;background:#c9c3b6;display:block}
.dot.good{background:#5f8a64}
.dot.bad{background:#c4704c}
.info{width:22px;height:22px;border:1px solid #56636a;border-radius:50%;background:none;font:inherit;font-size:13px;line-height:1;color:#56636a;cursor:pointer;padding:0}
.play{width:40px;height:40px;border-radius:50%;border:0;background:#4c7088;color:#ffffff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.play:hover{background:#303d43}
.rb{width:28px;height:28px;border-radius:50%;border:1px solid rgba(76,112,136,0.19);background:none;font:inherit;font-size:15px;line-height:1;color:#303d43;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
@media (max-width: 760px){.chip{padding:0 9px;gap:6px}.rb{width:22px;height:22px;font-size:13px}}
.mob .mw{white-space:nowrap}
.rb:hover{border-color:#4c7088}
.rb:disabled{opacity:0.35;cursor:default}
.add{width:32px;height:32px;border-radius:50%;border:1px dashed #4c7088;background:none;color:#4c7088;font:inherit;font-size:15px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.add:hover{background:rgba(76,112,136,0.06)}
.sw{width:40px;height:24px;border-radius:12px;border:0;background:#c9c3b6;padding:3px;display:flex;justify-content:flex-start;cursor:pointer;flex:none}
.sw.on{background:#4c7088;justify-content:flex-end}
.knob{width:18px;height:18px;border-radius:50%;background:#f4f0e9;display:block}
.run{background:#4c7088;color:#ffffff;border:0;border-radius:999px;font:inherit;font-size:13px;padding:0 16px;height:32px;cursor:pointer}
.run:disabled{opacity:0.4;cursor:default}
.ov{position:absolute;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ctl{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap}
.lab{position:absolute;display:flex;flex-direction:column;line-height:1.3;font-size:13px;white-space:nowrap}
.name{color:#56636a}
.val{color:#303d43;font-weight:600;font-variant-numeric:tabular-nums}
.val.short{color:#b0532f}
.mw{font-size:13px;color:#303d43;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
.flow{animation:flow 1s linear infinite}
.flow-rev{animation:flowrev 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
@keyframes flowrev{to{stroke-dashoffset:26}}
.spin-slow{animation:spin 9s linear infinite}
.spin{animation:spin 4.5s linear infinite}
.spin-fast{animation:spin 2s linear infinite}
.spin-slow,.spin,.spin-fast{transform-origin:0 0}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.flow,.flow-rev,.spin-slow,.spin,.spin-fast{animation:none}}
.chart{display:block;cursor:pointer}
.desk{display:block}
.mob{display:none}
@media (max-width: 760px){.desk{display:none}.mob{display:block}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(76,112,136,0.19);border-bottom:1px solid rgba(76,112,136,0.19)}
.fact{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border-left:1px solid rgba(76,112,136,0.19);min-width:0}
.fact:first-child{border-left:0;padding-left:0}
.flab{font-size:13px;color:#56636a;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fval{font-size:20px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;color:#303d43}
@media (max-width: 760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(3){border-left:0;padding-left:0}.fact:nth-child(n+3){border-top:1px solid rgba(76,112,136,0.19)}}
.tick{display:flex;align-items:stretch;background:rgba(76,112,136,0.06);color:#303d43;border:1px solid rgba(76,112,136,0.19);border-radius:6px;overflow:hidden;font-size:13px;height:30px}
.tick-b{flex:none;display:flex;align-items:center;padding:0 10px;background:rgba(76,112,136,0.12);color:#4c7088;font-weight:600;letter-spacing:0.06em;font-size:11px}
.tick-w{flex:1;overflow:hidden;display:flex;align-items:center;min-width:0}
.tick-in{display:inline-flex;white-space:nowrap;animation:tick 30s linear infinite;will-change:transform}
.tick-in span{padding-right:64px}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.tick{height:auto}.tick-in{animation:none;white-space:normal;padding:6px 0}.tick-in span+span{display:none}}
.mood{display:flex;align-items:center;gap:10px;font-size:13px}
.mood-bar{flex:1;height:12px;border-radius:6px;background:rgba(76,112,136,0.06);box-shadow:inset 0 0 0 1px rgba(76,112,136,0.19);display:flex;overflow:hidden}
.mood-seg{height:100%;border-right:1.5px solid #f4f0e9;box-sizing:border-box;transition:width .5s ease,background-color .5s ease}
.mood-w{font-weight:600;min-width:64px;text-align:right}
.fnote{font-size:12px;color:#b8322a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:15px}
.fval.hot{color:#b8322a}
.fnote.ok{color:#56636a}
.pp{transition:opacity .8s ease}
.wave{transform-box:fill-box;transform-origin:30% 100%;animation:wave 1.1s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.fall{animation:fall 6s linear infinite}
@keyframes fall{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(8px,130px);opacity:0}}
@media (prefers-reduced-motion: reduce){.wave,.fall{animation:none}}
.spd{min-width:44px;justify-content:center;font-variant-numeric:tabular-nums}
.ml{position:absolute;top:1px;transform:translateX(-50%);font-size:11px;color:#56636a}
.fury{display:flex;align-items:center;gap:10px;font-size:13px;color:#b8322a;font-weight:600}
.fury-bar{flex:1;height:8px;border-radius:4px;background:#f1d9d3;overflow:hidden}
.fury-bar span{display:block;height:100%;background:#b8322a;transition:width .4s ease}
.board{position:absolute;border-radius:4px;overflow:hidden;background:#ffffff;box-shadow:0 0 0 1.5px #303d43}
.board svg{display:block;width:100%;height:100%}
.board-empty{display:flex;align-items:center;justify-content:center;height:100%;font-size:12px;color:#56636a;background:repeating-linear-gradient(135deg,#f4f0e9 0 6px,#ebe6dc 6px 12px)}
.buy{background:#4c7088;color:#ffffff;border:0;border-radius:999px;font:inherit;font-size:13px;font-weight:600;height:30px;padding:0 14px;cursor:pointer}
.buy:hover{background:#303d43}
.ghost{background:none;color:#303d43;border:1px solid rgba(76,112,136,0.19);border-radius:999px;font:inherit;font-size:13px;height:34px;padding:0 16px;cursor:pointer}
.ghost:hover{border-color:#4c7088}
.ov{white-space:normal;position:fixed;inset:0;background:rgba(48,61,67,0.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;box-sizing:border-box}
.mbox{background:#f4f0e9;border-radius:14px;max-width:560px;width:100%;max-height:100%;overflow-y:auto;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,0.25)}
.mbox h2{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.mbox p{margin:0;font-size:15px;line-height:1.5}
.adgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width: 520px){.adgrid{grid-template-columns:minmax(0,1fr)}}
.mbox>*{min-width:0}
.mbox p{overflow-wrap:break-word}
.mob .mw{font-size:12px;letter-spacing:-0.01em}
.adcard{border:1px solid rgba(76,112,136,0.19);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:#ffffff}
.adcard svg{display:block;width:100%;height:auto}
.adcard .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.adcard b{font-size:15px}
.adcard i{font-style:normal;color:#56636a}
.big{font-size:44px;line-height:1;text-align:center}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font:inherit;color:#303d43;cursor:pointer;text-align:right}
.who-t{display:flex;flex-direction:column;font-size:13px;line-height:1.3}
.who-t b{font-weight:600}
.who-t span{color:#56636a}
.who-p{width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px #f4f0e9,0 0 0 3px rgba(76,112,136,0.19);flex:none;display:block;overflow:hidden}
.who:hover .who-p{box-shadow:0 0 0 2px #f4f0e9,0 0 0 3px #4c7088}
.who-p svg,.pick-p svg{display:block;width:100%;height:100%}
@media (max-width: 520px){.who-t{display:none}.who-p{width:44px;height:44px}}
.pick{flex-direction:row;align-items:flex-start;gap:10px;padding:10px;text-align:left;font:inherit;color:#303d43;cursor:pointer}
.pick:hover,.pick.on{border-color:#4c7088;box-shadow:0 0 0 1px #4c7088}
.pick .in{padding:0}
.pick-p{width:56px;height:56px;flex:none;display:block}
.rst{width:32px;height:32px;border-radius:50%;border:1px solid rgba(76,112,136,0.19);background:none;color:#303d43;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;flex:none}
.rst:hover{border-color:#4c7088}
.gust{animation:gust 4.6s ease-in-out infinite}
@keyframes gust{0%{transform:translateX(0);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateX(200px);opacity:0}}
.smk{animation:smk 2.4s ease-out infinite}
@keyframes smk{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-14px) scale(1.6);opacity:0}}
@media (prefers-reduced-motion: reduce){.gust,.smk{animation:none}}
.cookbtn{display:inline-flex;align-items:center;gap:4px;background:#ffffff;border:1px solid rgba(76,112,136,0.19);border-radius:999px;font:inherit;font-size:12px;color:#303d43;padding:2px 8px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.12);white-space:nowrap}
.cookbtn:hover{border-color:#4c7088}
.intro-art{display:flex;justify-content:center;gap:8px}
.intro-art span{width:52px;height:52px;display:block}
.intro-art svg{display:block;width:100%;height:100%}
.lvls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width: 520px){.lvls{grid-template-columns:minmax(0,1fr)}}
.lvl .in{gap:4px}
.xl{font-weight:700;font-size:13px;line-height:1}
.xbtn{background:#111111;color:#ffffff;border-color:#111111}
.xbtn:hover{background:#303d43}
.tweet{display:flex;gap:10px;background:#ffffff;border:1px solid rgba(76,112,136,0.19);border-radius:10px;padding:10px}
.tw-p{width:40px;height:40px;flex:none;display:block}
.tw-p svg{display:block;width:100%;height:100%}
.tw-b{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.45;min-width:0}
.tw-b i{font-style:normal;color:#56636a}
.xpost{align-self:flex-start;background:#111111;height:28px;margin-top:2px}
.xpost:hover{background:#303d43}
.fval.bad{color:#b8322a;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){.fval.bad{animation:none}}
.gc{background:#ffffff;border:1px solid rgba(76,112,136,0.19);border-radius:999px;font:inherit;font-size:11px;color:#56636a;padding:2px 8px;cursor:pointer;white-space:nowrap}
.gc.on{background:#5f7968;border-color:#5f7968;color:#ffffff}
.gc:hover{border-color:#4c7088}
.dl{font-size:13px;color:#56636a;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.dl.on{color:#303d43;font-weight:600}
.link{background:none;border:0;font:inherit;font-size:13px;color:#4c7088;padding:0;cursor:pointer}
</style>
</head>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
<button type="button" class="play" aria-label="{{playLabel}}" onClick="{{togglePlay}}"><sc-if value="{{isPaused}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display: block"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg></sc-if><sc-if value="{{isPlaying}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="display: block"><rect x="6.5" y="5" width="3.6" height="14" rx="1" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1" fill="currentColor"/></svg></sc-if></button>
<button type="button" class="rst" aria-label="Reset: back to January 1, no ads, fines or protests" title="Reset" onClick="{{reset}}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12a7 7 0 1 0 2.2-5.1" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M4.5 3.5v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 104px">{{hourDate}}, {{hourTime}}</span>
<span style="font-size: 13px; color: #56636a">{{seasonName}}</span>
<div style="display: flex; align-items: center; gap: 10px; margin-left: auto"><button type="button" class="chip spd" aria-label="Playback speed" onClick="{{cycleSpeed}}">{{speedLabel}}</button><button type="button" class="info" aria-label="About the year" aria-expanded="{{showInfo}}" onClick="{{toggleInfo}}">i</button></div>
</div>
<sc-if value="{{showInfo}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; line-height: 1.5; color: #56636a">A whole weather year, hour by hour. Winter: strong wind, little sun. Summer: less wind, more sun. The datacenter uses a bit more in summer, for cooling. The speed button runs time faster.</p></sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column">
<svg class="chart" viewBox="0 0 360 30" width="100%" height="28" preserveAspectRatio="none" role="img" aria-label="The whole year. Select a point to move there." onClick="{{onOverview}}" style="background: rgba(76,112,136,0.06); border-radius: 6px"><rect x="0.0" y="0" width="58.4" height="30" fill="#e3e9ee"></rect><rect x="58.4" y="0" width="91.0" height="30" fill="#e6eedb"></rect><rect x="149.3" y="0" width="91.0" height="30" fill="#f2ecd6"></rect><rect x="240.3" y="0" width="90.0" height="30" fill="#f1e4d4"></rect><rect x="330.3" y="0" width="30.7" height="30" fill="#e3e9ee"></rect>
<path d="{{overview}}" fill="#b5c9d6"></path>
<path d="{{ovLoad}}" fill="none" stroke="#303d43" stroke-width="1" stroke-opacity="0.7" vector-effect="non-scaling-stroke"></path>
<rect x="{{winX}}" y="0.5" width="{{winW}}" height="29" fill="none" stroke="#4c7088" stroke-width="1.2" vector-effect="non-scaling-stroke"></rect>
<line x1="{{ovX}}" x2="{{ovX}}" y1="0" y2="30" stroke="#303d43" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
</svg>
<div style="position: relative; height: 15px" aria-hidden="true"><span class="ml" style="left: 4.25%">J</span><span class="ml" style="left: 12.33%">F</span><span class="ml" style="left: 20.41%">M</span><span class="ml" style="left: 28.77%">A</span><span class="ml" style="left: 37.12%">M</span><span class="ml" style="left: 45.48%">J</span><span class="ml" style="left: 53.84%">J</span><span class="ml" style="left: 62.33%">A</span><span class="ml" style="left: 70.68%">S</span><span class="ml" style="left: 79.04%">O</span><span class="ml" style="left: 87.40%">N</span><span class="ml" style="left: 95.75%">D</span></div><svg viewBox="0 0 360 14" width="100%" height="14" preserveAspectRatio="none" aria-hidden="true" style="display: block"><polygon points="{{zoomPts}}" fill="#4c7088" fill-opacity="0.08"></polygon></svg>
<svg class="chart" viewBox="0 0 360 160" width="100%" height="120" preserveAspectRatio="none" role="img" aria-label="Supply by source against datacenter use, one week. Select a point to move there." onClick="{{onWindow}}" style="background: rgba(76,112,136,0.06); border-radius: 6px"><path d="{{chart.mid}}" stroke="rgba(76,112,136,0.19)" stroke-width="1" vector-effect="non-scaling-stroke"></path><path d="{{chart.night}}" fill="#28343c" fill-opacity="0.13"></path><path d="{{chart.paths.deficit}}" fill="{{deficitColor}}"></path><path d="{{chart.paths.nuclear}}" fill="#7a6a8c"></path><path d="{{chart.paths.onwind}}" fill="#4f7a96"></path><path d="{{chart.paths.offwind}}" fill="#24435a"></path><path d="{{chart.paths.solar}}" fill="#b18b5e"></path><path d="{{chart.paths.battery}}" fill="#5f7968"></path><path d="{{chart.paths.gas}}" fill="#8a7666"></path><path d="{{chart.paths.load}}" fill="none" stroke="#303d43" stroke-width="1.5" vector-effect="non-scaling-stroke"></path><path d="{{chart.ticks}}" stroke="#56636a" stroke-opacity="0.5" stroke-width="1" vector-effect="non-scaling-stroke"></path><line x1="{{playX}}" x2="{{playX}}" y1="0" y2="160" stroke="#303d43" stroke-width="1.5" vector-effect="non-scaling-stroke"></line></svg><div style="position: relative; height: 20px; overflow: hidden"><sc-for list="{{days}}" as="dd" hint-placeholder-count="7"><span class="{{dd.cls}}" style="position: absolute; top: 3px; transform: translateX(-50%); {{dd.left}}">{{dd.label}}</span></sc-for></div>
</div>
</sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<button type="button" class="chip" aria-expanded="{{ruleOpen}}" onClick="{{toggleRule}}"><span class="{{dotCls}}"></span>Policy: {{ruleText}}</button>
<button type="button" class="chip" aria-expanded="{{optOpen}}" onClick="{{toggleOpt}}">Find mix</button>
<sc-if value="{{ruleOpen}}" hint-placeholder-val="{{ false }}"><div class="track" role="group" aria-label="Policy"><sc-for list="{{matchingButtons}}" as="b" hint-placeholder-count="3"><button type="button" class="{{b.cls}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">{{b.label}}</button></sc-for></div></sc-if>
<sc-if value="{{showShare}}" hint-placeholder-val="{{ false }}"><div class="track" role="group" aria-label="Required share"><sc-for list="{{shareButtons}}" as="b" hint-placeholder-count="3"><button type="button" class="{{b.cls}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">{{b.label}}</button></sc-for></div></sc-if>
<sc-if value="{{optOpen}}" hint-placeholder-val="{{ false }}"><div class="track" role="group" aria-label="Which plants"><sc-for list="{{setButtons}}" as="b" hint-placeholder-count="3"><button type="button" class="{{b.cls}}" aria-pressed="{{b.pressed}}" onClick="{{b.pick}}">{{b.label}}</button></sc-for></div><button type="button" class="run" disabled="{{cantRun}}" onClick="{{runOpt}}">{{runLabel}}</button><span style="font-size: 13px">{{optMsg}}</span></sc-if>
</div>

<sc-if value="{{loading}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 13px; color: #56636a">Loading…</p></sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div class="mood"><span class="name">Public anger</span><div class="mood-bar" role="meter" aria-label="Public anger" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{mood.pct}}"><sc-for list="{{mood.segs}}" as="sg" hint-placeholder-count="3"><span class="mood-seg" style="{{sg.style}}" title="{{sg.title}}"></span></sc-for></div><span class="mood-w" style="color: {{mood.color}}">{{mood.word}}</span></div>
<span style="font-size: 13px; color: #56636a; margin-top: -4px">{{mood.legend}}. {{mood.calmNote}}</span>
<sc-if value="{{fury.show}}" hint-placeholder-val="{{ false }}"><div class="fury"><span>Protesters on the fence</span><div class="fury-bar"><span style="width: {{fury.w}}%"></span></div></div>
</div></sc-if>

<p>You are responsible for planning and operating the power supply for a 300 MW datacenter in central Sweden.</p>
<p>Balance fickle public opinion with the need to keep your customers happy. The local population is sensitive to rising electricity prices and does not want its view spoiled by wind parks. Solar parks upset farmers, and gas plants emit CO2, angering environmentalists.</p>

<sc-if value="{{showAbout}}" hint-placeholder-val="{{ false }}"><p style="margin: 8px 0 0; font-size: 13px; color: #56636a; line-height: 1.6; max-width: 760px">Model data from the PyPSA model behind this project: 2035, bidding zone SE3, one weather year, every hour. One site and its own plants, not the whole electricity system. The datacenter's use follows the model's hyperscale profile, scaled so that the peak hour is 300 MW. It averages about 285 MW and is a little higher in summer, for cooling. Use matched is the share of the year's use that the new wind, solar and nuclear plants cover in the same hour, directly or through the batteries. Gas and grid power do not count, because they are not clean, additional power. The grid connection needed is the largest hourly flow to or from the grid over the year. Nuclear runs at full capacity when it runs, which is this page's own choice. The model instead uses an even 85 % availability. Batteries store 4 hours and start the year empty. With the grid connected, you can let them charge from the grid at night, 22:00 to 06:00. That energy is saved for the day and does not count as matched. A shortfall is covered by the battery, then gas, then the grid. Existing hydro is left out because it is not additional. When there is not enough power, the datacenter throttles and runs at whatever power it gets. Costs are annualised investment and running costs of the new plants, without gas fuel or electricity prices. The game parts are made up for fun and are not model results: the anger meter, the protesters, the ads, the fines, the Consumer Agency, the cookouts, the unplanned reactor outages, and grid power bought at night angering neighbours less. Each reactor of up to 300 MW can trip in any hour with a chance of 1 in 4,000 and then stays down for 2 to 10 days.</p></sc-if>

<script>
// Small runtime that renders a .dc.html template in a plain web page.
// Supports {{a.b}} holes in text and attributes, <sc-if value>, <sc-for list as>,
// onClick handlers and setState. Re-renders by morphing the live DOM in place.
(function () {
  const tpl = document.getElementById('dc-template');
  const root = document.getElementById('dc-root');
  const tree = tpl.content;
  const HOLE = /\{\{\s*([^}]*?)\s*\}\}/g;
  const ONE = /^\{\{\s*([^}]*?)\s*\}\}$/;

  function look(scope, path) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    let v = scope;
    for (const k of path.split('.')) {
      if (v == null) return undefined;
      v = v[k];
    }
    return v;
  }
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const sub = (str, scope) => str.replace(HOLE, (_, p) => { const v = look(scope, p); return v == null ? '' : String(v); });

  let handlers = [];
  function attrs(el, scope) {
    let out = '';
    for (const a of el.attributes) {
      const name = a.name;
      if (name.startsWith('hint-')) continue;
      const m = a.value.match(ONE);
      if (m) {
        const v = look(scope, m[1]);
        if (/^on[A-Z]?[a-z]+$/i.test(name)) {
          if (typeof v === 'function') { handlers.push(v); out += ' data-dc-' + name.slice(2).toLowerCase() + '="' + (handlers.length - 1) + '"'; }
          continue;
        }
        if (name.startsWith('aria-')) { out += ' ' + name + '="' + esc(v == null ? '' : v) + '"'; continue; }
        if (v === false || v == null) continue;
        out += ' ' + name + '="' + (v === true ? '' : esc(v)) + '"';
        continue;
      }
      out += ' ' + name + '="' + esc(sub(a.value, scope)) + '"';
    }
    return out;
  }
  const VOID = new Set(['br', 'hr', 'img', 'input', 'link', 'meta', 'source', 'area', 'col', 'wbr']);
  function kids(node, scope) {
    let s = '';
    for (const ch of node.childNodes) s += render(ch, scope);
    return s;
  }
  function render(node, scope) {
    if (node.nodeType === 3) return esc(sub(node.nodeValue, scope));
    if (node.nodeType !== 1) return '';
    const tag = node.localName;
    if (tag === 'sc-if') {
      const m = (node.getAttribute('value') || '').match(ONE);
      return m && look(scope, m[1]) ? kids(node, scope) : '';
    }
    if (tag === 'sc-for') {
      const m = (node.getAttribute('list') || '').match(ONE);
      const list = (m && look(scope, m[1])) || [];
      const as = node.getAttribute('as') || 'item';
      let s = '';
      for (let i = 0; i < list.length; i++) s += kids(node, Object.assign(Object.create(scope), { [as]: list[i] }));
      return s;
    }
    const open = '<' + tag + attrs(node, scope) + '>';

    return open + kids(node, scope) + '</' + tag + '>';

    if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName) { a.replaceWith(b); return; }
    if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
    if (a.nodeType !== 1) return;
    for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
    for (const at of b.attributes) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
    const ak = a.childNodes, bk = [...b.childNodes];
    let i = 0;
    for (; i < bk.length; i++) {
      if (i < ak.length) morph(ak[i], bk[i]);
      else a.appendChild(bk[i]);
    }
    while (ak.length > bk.length) a.removeChild(a.lastChild);
  }

  window.DCLogic = class {
    constructor() { this.state = {}; }
    setState(p) { Object.assign(this.state, p); schedule(); }
  };
  let comp, queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; paint(); });
  }
  const scratch = document.createElement('div');
  function paint() {
    handlers = [];
    let vals = {};
    try { vals = comp.renderVals() || {}; } catch (e) { console.error(e); }
    scratch.innerHTML = kids(tree, vals);
    if (!root.firstChild) { while (scratch.firstChild) root.appendChild(scratch.firstChild); }
    else {
      const ak = root.childNodes, bk = [...scratch.childNodes];
      for (let i = 0; i < bk.length; i++) { if (i < ak.length) morph(ak[i], bk[i]); else root.appendChild(bk[i]); }
      while (ak.length > bk.length) root.removeChild(root.lastChild);
    }

  }
  let current = [];

  }

  // probability and then stays down 2 to 10 days. The draw is fixed by a seed, so the
  // same year plays out the same way until you reset.

    if (this._out && this._out.seed === seed) return this._out;

  }

  derived(data, c, M) {

  arrays(data) {

  feasible(A, x, rule, share, gridOn, batH, eta, data, full) {
    const n = A.load.length;
    const nav = this.nucAvail(x.nuclear, A.seed);
    if (rule === 'annual') {

        if (E > 0) {

        need -= g;

        if (need > 0) imp += need;

    const share = c.share / 100;

    const steps = { onwind: 50, solar: 50, offwind: 50, nuclear: 50, battery: 25, gas: 25 };

    let cur = Object.assign({}, best), curCost = bestCost;

  smoothChart(r, startF, M) {

      for (let j = 0; j < cnt; j++) cum[j] += L.vals[i0 + j];

      for (let j = 1; j < cnt; j++) p += 'L' + x(i0 + j) + ',' + y(cum[j]);

  charOf(s) {
    return this.chars().find((x) => x.key === s.char) || null;
  }

  // Sum of an hourly series over the week ending at hour h (wraps around new year).
  weekSum(cum, h) {
    const n = cum.length - 1, a = h - 167;
    if (a >= 0) return cum[h + 1] - cum[a];
    return cum[h + 1] + cum[n] - cum[n + a];
  }

  extrasNow(s) {
    const t = s.gameT || 0;
    return (s.extras || []).filter((e) => e.until > t);
  }

  plantCost(data, c, M) {
    let cost = 0;
    M.clean.forEach((k) => { cost += c.mw[k] * data.capital_cost_eur_per_mw_year[k]; });
    cost += c.mw.nuclear * 8760 * M.nuclearVar;
    cost += c.mw.battery * data.battery.power_eur_per_mw_year + c.mw.battery * c.batH * data.battery.energy_eur_per_mwh_year + c.mw.gas * M.gas.capital;
    return cost;
  }

  // Made-up anger score. Plants anger people all the time, operations over the past week.
  anger(data, c, M, d, hour, s) {
    const r = d.r;
    const extra = this.extrasNow(s).reduce((x, e) => x + e.amount, 0);
    const cost = this.plantCost(data, c, M) + extra;
    // While you design, before the first press of play, nobody is angry yet.
    if (!s.started) return { pub: 0, parts: [], raw: 0, calm: 0, adCalm: 0, expCalm: 0, cookCalm: 0, total: 0, cost: cost, extra: extra };
    const wl = this.weekSum(r.cum.load, hour);
    const uns = this.weekSum(r.cum.uns, hour) / wl;
    const ch = this.charOf(s);
    const md = Object.assign({ renew: 1, gas: 1, nuclear: 1, cust: 1, ad: 1, cfo: 1, fine: 1 }, ch ? ch.mod : {});
    const parts = [
      { label: 'Wind turbine neighbours', v: (c.mw.onwind / 26) * md.renew, pub: true },
      { label: 'Fishermen', v: (c.mw.offwind / 40) * md.renew, pub: true },
      { label: 'Farmers', v: (c.mw.solar / 40) * md.renew, pub: true },
      { label: 'Nuclear sceptics', v: ((c.mw.nuclear / 45) + (c.mw.nuclear > 0 && this.weekSum(r.cum.nucLost, hour) > 1 ? 10 : 0)) * md.nuclear, pub: true },
      { label: 'Climate activists', v: (this.weekSum(r.cum.gas, hour) / 168 / 6) * md.gas, pub: true },
      { label: 'Neighbours with higher power bills', v: this.weekSum(r.cum.impW, hour) / 168 / 2.5, pub: true },
      { label: 'Your customers', v: uns < 0.98 ? uns * 60 * md.cust : 0 },
      { label: 'Your CFO', v: (cost / 1e6 / 6) * md.cfo }
    ];
    {
      const gap = this.policyGap(c, d);
      // Regulator pressure builds up over a quarter below the policy.
      const ramp = Math.min(1, (s.regH || 0) / 2184);
      if (gap > 0.05 && ramp * Math.min(25, 3 + gap * 0.8) >= 0.5) parts.push({ label: 'Regulators', v: ramp * Math.min(25, 3 + gap * 0.8) });
    }
    // Al's posts: investors love them, everyone else does not.
    if (s.tweet && (s.gameT || 0) - s.tweet.t0 < 504) {
      const f = 1 - ((s.gameT || 0) - s.tweet.t0) / 504;
      parts[parts.length - 1].v = Math.max(0, parts[parts.length - 1].v - 8 * f);
      parts.push({ label: 'People who read Al’s posts', v: 15 * f, pub: true });
    }
    const t = s.gameT || 0;
    const ad = s.campaign;
    let calm = 0, backlash = 0;
    if (ad) {
      if (ad.busted) backlash = 20 * Math.max(0, 1 - (t - ad.tr) / 1344);
      else calm = ad.calm * md.ad * Math.max(0, 1 - (t - ad.t0) / 1344);
    }
    // A cookout outside the fence, paid for by you.
    let cookCalm = 0;
    let cookAngry = 0;
    if (s.cookout) {
      const f = Math.max(0, 1 - (t - s.cookout.t0) / 672);

    const expCalm = Math.min(30, this.weekSum(r.cum.exp, hour) / 168 / 8);
    calm += expCalm;

    if (cookAngry > 0.5) parts.push({ label: s.cookout.lab ? 'People who did not want lab-grown meat' : 'People who wanted real hot dogs', v: cookAngry, pub: true });

  // How far below the policy the plants are, in percentage points. Only counts with a grid

  policyGap(c, d) {
    if (c.matching === 'none' || c.grid !== 'on') return 0;
    const sm = d.r.sum;
    const shown = c.matching === 'annual' ? sm.gen / sm.load : sm.clean / sm.load;
    return Math.max(0, c.share - shown * 100);

  claimCheck(ad, d, M) {
    const sm = d.r.sum;
    if (ad.key === 'digital') return { ok: true };
    if (ad.key === 'jobs') return { ok: false, why: 'Datacenters need few permanent staff. “Thousands of jobs” does not hold up.' };
    if (ad.key === 'fossil') {
      const kt = sm.gas * M.gas.co2 / 1000;
      return sm.gas / sm.load < 0.005 ? { ok: true } : { ok: false, why: 'You burn gas: ' + this.fmt(kt) + ' kt of CO2 a year.' };
    }
    const ren = sm.gen > 0 ? (sm.clean / sm.load) * (sm.ren / sm.gen) : 0;
    return ren >= 0.9 ? { ok: true } : { ok: false, why: 'Only ' + this.fmt(ren * 100) + ' % of your power comes from your own wind and sun, hour by hour.' };

  tick() {
    const s = this.state || {};
    const M = this.meta();
    const sp = M.speeds.find((x) => x.key === (s.speed || 1)) || M.speeds[0];

      const m = s.data.year;
      this._rot = this._rot || { onwind: 0, offwind: 0 };
      this._rot.onwind = (this._rot.onwind + 10 * m.onwind[hour]) % 360;
      this._rot.offwind = (this._rot.offwind + 10 * m.offwind[hour]) % 360;
      if (adv > 0) {

        const d = this.derived(s.data, c, M);
        const st = Object.assign({}, s, up);
        const a = this.anger(s.data, c, M, d, hour, st);

        up.furyH = fury;

        } else if (gap > 0.05) {

          const strikes = up.regStrikes;
          const fine = strikes <= 1 ? 0 : Math.max(2, Math.round(gap * 0.5 * (strikes - 1))) * 1e6;
          if (fine > 0) up.extras = this.extrasNow(st).concat([{ label: 'regulator fine', amount: fine, until: gameT + 2184 }]);
          this.stop();
          Object.assign(up, { playing: false, resume: true, modal: { kind: 'reg', gap: this.fmt(gap, 1), fine: this.fmt(fine / 1e6), warn: fine === 0 } });
        } else if (s.campaign && !s.campaign.reviewed && gameT - s.campaign.t0 >= 336) {

          const res = this.claimCheck(ad, d, M);
          const camp = Object.assign({}, s.campaign, { reviewed: true, ok: res.ok });
          if (!res.ok) {

            const fine = 25e6 * (((this.charOf(s) || {}).mod || {}).fine || 1);
            up.extras = this.extrasNow(st).concat([{ label: 'fine', amount: fine, until: gameT + 2184 }]);
          }
          this.stop();
          Object.assign(up, { campaign: camp, playing: false, resume: true, modal: { kind: 'review', ok: res.ok, why: res.why || '', name: ad.name, fine: res.ok ? 0 : 25 * (((this.charOf(s) || {}).mod || {}).fine || 1) } });
        }
      }
    }
    this.setState(up);
  }

  }
}
