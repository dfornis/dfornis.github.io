<h2>Power a datacenter</h2>
<p>You run a colocation datacenter in central Sweden. Other companies rent space in the hall for their servers, and you supply the power. The hall has room for 200 MW, and at the start customers use 125 MW of it. New customers move in when everyone has had all the power they need for a while. The board can approve three expansions, 100 MW at a time, up to 500 MW. Customers pay for the capacity they reserve and for the power they use. A round is one year.</p>

<p>Balance fickle public opinion with the need to keep your customers happy. The local population is sensitive to rising electricity prices and does not want its view spoiled by wind parks. Solar parks upset farmers, and gas plants emit CO2, angering environmentalists.</p>
<p><b>Choose a level.</b></p>
<div class="lvls"><sc-for list="{{levels}}" as="l" hint-placeholder-count="3"><button type="button" class="adcard pick lvl" onClick="{{l.pick}}"><span class="in"><b>{{l.name}}</b><i class="{{l.icls}}">{{l.rule}}</i><span>{{l.text}}</span></span></button></sc-for></div>
</div></sc-if>
<sc-if value="{{modal.reg}}" hint-placeholder-val="{{ false }}"><div class="mbox">
<div class="big">📋</div><h2>The regulator has checked your numbers</h2>
<p>You are connected to the grid, and the power that meets your policy is {{modal.gap}} percentage points short. The regulator checks every month.</p>
<sc-if value="{{modal.regWarn}}" hint-placeholder-val="{{ true }}"><p><b>This time it is a warning.</b> Next month there will be a fine, and it grows the longer you stay below the policy.</p></sc-if>
<sc-if value="{{modal.regFined}}" hint-placeholder-val="{{ false }}"><p><b>Fine: {{modal.regFine}} M€.</b> It grows each month you stay below the policy. Build more clean power, or leave the grid and accept power cuts instead.</p></sc-if>
<button type="button" class="buy" style="align-self: flex-end; height: 34px" onClick="{{closeModal}}">OK</button>
</div></sc-if>
<sc-if value="{{modal.accounts}}"><div class="mbox">
<h2>{{accountsPanel.title}}</h2>
<div class="accounts-list"><sc-for list="{{accountsPanel.rows}}" as="row"><div class="{{row.cls}}"><span class="mb-l">{{row.label}}</span><span class="mb-v">{{row.value}}</span></div></sc-for></div>
<button type="button" class="buy" style="align-self: flex-end" onClick="{{closeModal}}">Close</button>
</div></sc-if>
<sc-if value="{{modal.racks}}"><div class="mbox">

<div class="rack-grid" aria-hidden="true"><sc-for list="{{rackPanel.cells}}" as="rack"><span class="{{rack.cls}}" style="{{rack.style}}"></span></sc-for></div>

<p class="xnote">{{expand.nextNote}}</p>

</div>
<button type="button" class="ghost" style="align-self: flex-end" onClick="{{closeModal}}">Close</button>
</div></sc-if>

<p>You pay a connection fee once, then network fees: a yearly fee for the import capacity and a fee per MWh you import.</p>
<sc-if value="{{gridOffer.wait}}" hint-placeholder-val="{{ false }}"><p>Once the datacenter is open, a new connection takes a week to arrive.</p></sc-if>

</span></div></sc-for></div>

</div></sc-if>
<sc-if value="{{modal.nucinfo}}" hint-placeholder-val="{{ false }}"><div class="mbox">
<div class="big">⚛️</div><h2>Small modular reactors</h2>
<p>Nuclear comes in 50 MW modules. Each costs about 35 M€ a year, running or not. In the planning phase they are ready at once. After that, a new one takes two weeks to build.</p>
<p>Every module stops {{refuel.days}} days a year for new fuel, one at a time. A module can also trip without warning and stay down for 2 to 10 days.</p>
<p>Nuclear sceptics get angry as soon as you build any.</p>
<div style="display: flex; justify-content: flex-end"><button type="button" class="buy" style="height: 34px" onClick="{{closeModal}}">OK</button></div>
</div></sc-if>
<sc-if value="{{modal.refuel}}" hint-placeholder-val="{{ false }}"><div class="mbox">
<div class="big">🔧</div><h2>Refuelling the reactor modules</h2>
<p>Your nuclear power is {{refuel.modules}} small modular reactors of 50 MW each. Once a year each module stops for new fuel and maintenance, for {{refuel.days}} days. The modules take turns, so only one is off at a time: about {{refuel.share}} % of your nuclear power.</p>
<sc-if value="{{refuel.building}}" hint-placeholder-val="{{ false }}"><p>{{refuel.buildTxt}}</p></sc-if>
<sc-if value="{{refuel.rfIn}}" hint-placeholder-val="{{ false }}"><p>One module is refuelling now, {{refuel.leftTxt}} days left.</p></sc-if>
<sc-if value="{{refuel.notIn}}" hint-placeholder-val="{{ true }}"><p>The next module stops on <b>{{refuel.nextDate}}</b>.</p></sc-if>
<p>With few modules, each stop takes a large share of your nuclear power, so keep something else ready: battery, wind, solar, gas or the grid. With many modules, each stop matters less.</p>
<div style="display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap"><button type="button" class="buy" style="height: 34px" onClick="{{closeModal}}">OK</button></div>
</div></sc-if>

<sc-if value="{{lunch.again}}" hint-placeholder-val="{{ false }}"><p><i>Me again. Same table. Hear me out.</i></p></sc-if>
<p>I might have an offer you can’t refuse. Heard those AI-generated jingles in radio and podcast ads lately? That’s us, and our servers are running hot. People are putting out AI tracks by the truckload instead of hiring real musicians. Great business, but we need more compute, both to keep up and to train our next model, SerenAId 7.4. Even more sound waves, even faster.</p>
<p>So here’s the deal: we pay 10 % more than your current customers, for every rack they use. Throw them out and SerenAId us in. We’re changing the world here. Through music.</p>
<p>Let’s order some drinks.</p>
<p style="font-size: 13px; color: #56636a">If you say yes, your current customers are thrown out and Epistemic Noise takes over their {{lunch.racks}} racks, at {{lunch.rent}} more. The customers you throw out will be angry for a couple of months. After a bad week Epistemic Noise may give back part of its racks, more if customers lost power. New customers then move in as usual.</p>
<div style="display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap"><button type="button" class="ghost" onClick="{{lunch.no}}">No thanks</button><button type="button" class="buy" style="height: 34px" onClick="{{lunch.yes}}">Order the drinks</button></div>

<div>
<button type="button" class="link" aria-expanded="{{showAbout}}" onClick="{{toggleAbout}}">About this model +</button>
<sc-if value="{{showAbout}}" hint-placeholder-val="{{ false }}"><div class="about">
<p>A datacenter of up to 500 MW in bidding zone SE3, central Sweden, with its own power plants, simulated hour by hour over one year.</p>
<h3>Data</h3>
<ul>
<li>Wind, solar and datacenter load: hourly profiles from my PyPSA model of the Nordic power system, weather year 2023. The load is scaled to the racks rented, at most 500 MW. Planned Nordic datacenters are listed in the <a href="https://dfornis.github.io/projects/datacenter-tracker/" target="_blank" rel="noopener">datacenter tracker</a>.</li>
<li>Electricity prices: SE3 day-ahead prices for 2023 from <a href="https://www.energy-charts.info" target="_blank" rel="noopener">Energy-Charts</a>, 52 EUR/MWh on average.</li>
<li>Costs: Svenska kraftnät, <a href="https://www.svk.se/49da32/siteassets/om-oss/rapporter/langsiktig-marknadsanalys-2026/langsiktig-marknadsanalys-2026.pdf" target="_blank" rel="noopener">Långsiktig marknadsanalys 2026</a>. 2025 values in 2024 prices, annualised at 6 % real interest. Batteries come in 2, 4 or 8 hours of storage, with the report's cost for each. For nuclear we assume 8,000 EUR/kW to build instead of the report's 6,500, because small modular reactors are likely to cost more. Nuclear costs 5.5 EUR/MWh to run and gas about 143 EUR/MWh, including CO2 at 104 EUR/t.</li>
</ul>
<h3>How it works</h3>
<ul>
<li>Each hour the datacenter uses its own wind, solar and nuclear first, then the battery, gas and the grid. Without a grid connection, customers lose power when supply runs short. The battery plans 48 hours ahead with a forecast that is taken as exact. It saves charge for the hours that gas and the grid connection cannot cover, and spends the rest in the most expensive hours.</li>
<li>Surplus charges the battery and is then sold to the grid or curtailed.</li>
<li><b>Use matched</b> is the share of the load covered in the same hour by the new wind, solar and nuclear, directly or via the battery. The policy asks for at least 80 %. The level decides which of your plants help meet the policy. In Anything goes all of them do. In Fossil-free wind, solar and nuclear do. In Renewables only wind and solar do, and you cannot build gas or nuclear. Off-grid has no grid connection and no policy, so your own plants must cover every hour.</li>
<li><b>Grid connection needed</b> is the largest hourly flow to or from the grid.</li>
<li>Nuclear runs at full output except during outages. Batteries start empty.</li>
<li>Existing hydro is not included since it is not additional.</li>
</ul>
<h3>Own assumptions</h3>
<ul>
<li>Export revenue is based on hourly prices and scaled down if sales exceed 20% of the year’s demand. Monthly accounts estimate this share using the current mix. Any difference is settled at year-end.</li>
<li>Gas turbine efficiency is 41.5 %, taken from the model.</li>
<li>Energy tax: 36.0 öre/kWh on all power the datacenter uses, own production included, as <a href="https://www.skatteverket.se/foretag/skatterochavdrag/punktskatter/energiskatter/skattpael" target="_blank" rel="noopener">Skatteverket</a> sets it for 2026. VAT is left out, since a company deducts it.</li>
<li>Network fees: 100 SEK per kW of contracted import capacity a year, plus 3 öre per kWh imported. The one-time connection fees are game prices.</li>
<li>SEK are converted at 11 SEK per euro.</li>
</ul>
<h3>Colocation accounts</h3>
<ul>
<li>The hall has five modules of 100 MW, drawn as four racks each. Two modules stand from the start. Each rack stands for 25 MW of site power, about 22 MW of IT capacity at a PUE of 1.15, a game assumption. The year starts with 5 of 8 racks rented. The game rents out the IT capacity at €100 per reserved kW per month informed by <a href="https://links.sgx.com/FileOpen/FY%202025-26%20Results.ashx?App=Announcement&amp;FileID=888503" target="_blank" rel="noopener">wholesale rents in Vienna</a>. Customers also pay €90 per delivered MWh, close to the model’s cost of grid power, including tax and network fees. When customers lose power, they pay for less electricity and get a proportional rent credit. <a href="https://ecodatacenter.tech/hubfs/Annual%20Report%202025_EcoDC%20Holding%20AB_ENG.pdf" target="_blank" rel="noopener">EcoDataCenter’s 2025 annual report</a> describes its fixed capacity and variable electricity charges.</li>
<li>While the game runs, small marks rise from the week chart at most every five seconds. They show money that follows the power since the last marks: trade with the grid, marked with a lightning bolt: power sold minus power bought including its network fee per MWh, so plus when you sold more than you bought. Gas and nuclear fuel show as minus. Each mark appears where the playhead stands, on its own band, and stays at that hour. Your own wind, solar and battery cost the same whether they run or not, so they get no marks. The amounts cover more hours at higher speeds.</li>
<li>The building cost of the hall is paid from the company’s capital and kept out of these accounts, so they show results before the building cost. The board approves the next module when you have made a profit of €20m since the last expansion (€15m with Joe Solid) and public anger is below 50. Ads and fines count against the profit. Building takes a week. For scale: a 300 MW hall costs US$13.92m per IT MW to build in <a href="https://reports.turnerandtownsend.com/data-centre-construction-cost-index-2026/cost-trends?overlay=EMEA" target="_blank" rel="noopener">Turner &amp; Townsend’s Stockholm benchmark</a>. At US$1.13 per euro, with a 25-year annuity at 6%, this would come to about €251m a year, which the accounts leave out. Operating the hall costs €200,000 per IT MW per year excluding electricity, a game assumption for a large campus informed by <a href="https://assets.kpmg.com/content/dam/kpmgsites/sg/pdf/2026/05/benchmarking-capex-and-opex-in-the-global-data-centre-market.pdf.coredownload.inline.pdf" target="_blank" rel="noopener">KPMG’s operating cost benchmarks</a> for smaller European facilities.</li>
<li>No customer leaves during the first four weeks of play. After that, a customer can leave during a shortage if more than 0.5 MW went unserved in at least 3% of the hours in the preceding four weeks. Under Al the limit is 1.5%. At most one customer leaves per week. Customers lease 1–4 racks each. A new customer moves into the next empty lease after 6 days in a row without power cuts. A power cut restarts the count. Vacancies reduce rent. The power the hall uses follows the racks rented: 25 MW per rack, shaped by the fixed weather-year profile. The week chart shows this installed power as a dashed line.</li>
<li>The accounts record each hour as it is played. The grid connection fee and the load-shifting software are spread over the year like the plants. Fines, ads and cookouts are charged in the month they happen. The month tiles show what the month is expected to land on: every hour of that month in the weather year, with the current mix, occupancy and prices, plus one-time charges already made. The quarterly result adds up what was actually earned, hour by hour. Open the quarterly result to see the last closed quarter.</li>
</ul>
<h3>Game</h3>
<p>Made up: anger, protesters, ads, fines, the Consumer Agency, the regulator, cookouts, posts on X, the pace at which customers move in, the rule for expanding, the year-end comments and reactor outages. Nuclear is built as small modular reactors of 50 MW. Each module trips with a 1 in 4,000 chance per hour and stays down 2–10 days. Each module also stops for refuelling 10 days a year (8 with Sten), one module at a time, spread over the year. The timelines show these stops in purple. In the planning phase, before you press play, you can build as many modules as you like. After that, a new module takes two weeks to build.</p>

    const cover = c.mw.gas + (grid ? c.impCap : 0);

    const batPlan = (t, avail) => {
      const need0 = Lf[t] - Gf[t];
      const beyond0 = Math.min(P, Math.max(0, need0 - cover));
      let reserve = 0;
      const cand = [];
      for (let j = t + 1; j < Math.min(n, t + 48); j++) {
        const nd = Lf[j] - Gf[j];
        if (nd <= 0) { if (-nd * eta >= refill) break; continue; }
        const b = Math.min(P, Math.max(0, nd - cover));
        reserve += b;
        const room = Math.min(P, nd) - b;
        if (room > 0) cand.push([m.price[j], room]);
      }
      const now = Math.min(beyond0, avail);
      let left = avail - now - reserve;
      const room0 = Math.min(P, need0) - beyond0;
      if (left <= 0 || room0 <= 0) return now;
      // Spread what is left over the most expensive hours, this hour included.
      cand.push([m.price[t], room0, true]);
      cand.sort((a, b) => b[0] - a[0]);
      for (const [, room, me] of cand) {
        const x = Math.min(room, left);
        if (me) return now + x;
        left -= x;
        if (left <= 0) return now;
      }
      return now;
    };
    for (let t = 0; t < n; t++) {
      const load = Lf[t];
      let G = 0;
      const rfOff = t >= c.refuel && t < c.refuel + c.refuelLen;
      M.clean.forEach((k) => { const g = c.mw[k] * (k === 'nuclear' ? (rfOff ? 0 : nav[t]) : m[k][t]); r.gen[k].push(g); G += g; });
      let dis = 0, disC = 0, ch = 0, gas = 0, imp = 0, exp = 0, uns = 0, curt = 0;
      const night = (t % 24) >= 22 || (t % 24) < 6;
      if (G >= load) {
        ch = Math.max(0, Math.min(G - load, P, E > 0 ? (E - soc - socG) / eta : 0));
        soc += ch * eta;
        const rest = G - load - ch;
        if (grid) { exp = Math.min(rest, c.expCap); curt = rest - exp; } else curt = rest;
        if (gch && night) { const cg = Math.max(0, Math.min(P - ch, (E - soc - socG) / eta)); socG += cg * eta; ch += cg; imp += cg; }
      } else {
        let need = load - G;
        disC = E > 0 && soc > 0 ? Math.max(0, Math.min(need, P, soc * eta, batPlan(t, soc * eta))) : 0;
        soc -= disC / eta;
        need -= disC;
        // Grid energy bought at night is saved for the day.
        const disG = gch && night ? 0 : Math.max(0, Math.min(need, P - disC, socG * eta));
        socG -= disG / eta;
        need -= disG;
        dis = disC + disG;
        gas = Math.min(need, c.mw.gas);
        need -= gas;
        if (grid) { const i = Math.min(need, c.impCap); imp += i; uns = need - i; } else uns = need;
        if (gch && night) { const cg = Math.max(0, Math.min(P - dis, (E - soc - socG) / eta)); socG += cg * eta; ch += cg; imp += cg; }
      }
      const cl = Math.min(G, load) + disC;
      r.impW.push(night ? imp * 0.3 : imp);
      r.load.push(load); r.dis.push(dis); r.ch.push(ch); r.soc.push(E > 0 ? (soc + socG) / E : 0); r.gas.push(gas);
      r.imp.push(imp); r.exp.push(exp); r.uns.push(uns); r.curt.push(curt); r.stack.push(G + dis + gas); r.clean.push(cl);
      sum.load += load; sum.clean += cl; sum.gas += gas; sum.gen += G;
      // The same hour counted for the other levels: wind and solar only (battery included), or with your own gas too.
      { const rd = Math.min(G - r.gen.nuclear[t], load); sum.cleanRen += rd + Math.min(disC, Math.max(0, load - rd)); sum.cleanAll += Math.min(load, cl + gas); }
      sum.nuc += r.gen.nuclear[t]; sum.ren += G - r.gen.nuclear[t];

      sum.expRev += exp * m.price[t];
      sum.exp += exp;
      sum.imp += imp; sum.uns += uns; sum.maxImp = Math.max(sum.maxImp, imp); sum.maxExp = Math.max(sum.maxExp, exp);
    }
    r.sum = sum;
    // Running totals, for quick sums over any stretch of hours.
    const cum = (a) => { const o = new Float64Array(n + 1); for (let i = 0; i < n; i++) o[i + 1] = o[i] + a[i]; return o; };
    r.cum = { impW: cum(r.impW), nucLost: cum(Float64Array.from(this.nucTrip(c.mw.nuclear, c.seed), (v) => c.mw.nuclear * (1 - v))), load: cum(r.load), gas: cum(r.gas), imp: cum(r.imp), exp: cum(r.exp), uns: cum(r.uns), clean: cum(r.clean) };
    return r;
  }

  derived(data, c, M) {
    const key = JSON.stringify([c.mw, c.batH, c.grid, c.seed, c.batGrid, c.impCap, c.expCap, c.refuel, c.refuelLen, c.flex, c.rent]);
    if (this._d && this._d.key === key && this._d.data === data) return this._d;
    const r = this.simYear(data, c, M);
    r.nom = Float64Array.from(r.load, (_, t) => colocationTerms.rackMW * this.racksAt(c, t));
    const n = r.load.length, days = Math.floor(n / 24);
    // Year overview: daily mean on-site supply against daily mean use.
    const sup = [], use = [], imp = [];
    let om = 0;
    for (let d = 0; d < days; d++) {
      let a = 0, b = 0;
      let g = 0;
      for (let h = d * 24; h < d * 24 + 24; h++) { a += r.stack[h]; b += r.load[h]; g += r.imp[h]; }
      sup.push(a / 24); use.push(b / 24); imp.push(g / 24); om = Math.max(om, a / 24, b / 24);
    }
    om = Math.max(om * 1.1, 330);
    const ox = (i) => ((i * 360) / (days - 1)).toFixed(1);
    const oy = (v) => (30 - (Math.min(v, om) / om) * 28).toFixed(1);
    let ov = 'M0,30';
    for (let i = 0; i < days; i++) ov += 'L' + ox(i) + ',' + oy(sup[i]);
    ov += 'L360,30Z';
    let ovImp = 'M0,' + oy(sup[0]);
    for (let i = 0; i < days; i++) ovImp += 'L' + ox(i) + ',' + oy(sup[i] + imp[i]);
    for (let i = days - 1; i >= 0; i--) ovImp += 'L' + ox(i) + ',' + oy(sup[i]);
    ovImp += 'Z';
    let ovLoad = 'M0,' + oy(use[0]);
    for (let i = 1; i < days; i++) ovLoad += 'L' + ox(i) + ',' + oy(use[i]);
    this._d = { key: key, data: data, r: r, overview: ov, ovImp: ovImp, ovLoad: ovLoad };
    return this._d;
  }

  windowChart(r, start, ymax, M) {
    const w = M.win, W = 360, H = 150, top = 6;
    const x = (i) => ((i * W) / (w - 1)).toFixed(1);
    const y = (v) => (top + H - Math.min(1, v / ymax) * H).toFixed(1);
    const layers = [
      { key: 'nuclear', vals: r.gen.nuclear }, { key: 'onwind', vals: r.gen.onwind }, { key: 'offwind', vals: r.gen.offwind },
      { key: 'solar', vals: r.gen.solar }, { key: 'battery', vals: r.dis }, { key: 'gas', vals: r.gas }
    ];
    const cum = new Array(w).fill(0);
    const paths = {};
    layers.forEach((L) => {
      const bot = cum.slice();
      for (let i = 0; i < w; i++) cum[i] += L.vals[start + i];
      let s = 'M0,' + y(cum[0]);
      for (let i = 1; i < w; i++) s += 'L' + x(i) + ',' + y(cum[i]);
      for (let i = w - 1; i >= 0; i--) s += 'L' + x(i) + ',' + y(bot[i]);
      paths[L.key] = s + 'Z';
    });
    let load = 'M0,' + y(r.load[start]);
    for (let i = 1; i < w; i++) load += 'L' + x(i) + ',' + y(r.load[start + i]);
    paths.load = load;
    if (r.nom) {
      let nom = 'M0,' + y(r.nom[start]);
      for (let i = 1; i < w; i++) nom += 'L' + x(i) + ',' + y(r.nom[start + i - 1]) + 'L' + x(i) + ',' + y(r.nom[start + i]);
      paths.nom = nom;
    }

    for (let i = 1; i < w; i++) def += 'L' + x(i) + ',' + y(r.load[start + i]);
    for (let i = w - 1; i >= 0; i--) {
      const short = r.imp[start + i] + r.uns[start + i];
      def += 'L' + x(i) + ',' + y(r.load[start + i] - short);
    }
    paths.deficit = def + 'Z';
    const midnights = [];
    for (let i = 0; i < w; i++) if ((start + i) % 24 === 0) midnights.push(x(i));
    while (midnights.length < 4) midnights.push('-10');
    return { paths: paths, m1: midnights[0], m2: midnights[1], m3: midnights[2], m4: midnights[3], useY: y(M.dcMW) };
  }

  arrays(data) {
    if (this._arr && this._arr.data === data) return this._arr;
    const m = data.year;
    const o = { data: data, price: Float64Array.from(m.price), load: Float64Array.from(m.load, (v) => v * 300), onwind: Float64Array.from(m.onwind), solar: Float64Array.from(m.solar), offwind: Float64Array.from(m.offwind) };
    const s = (a) => { let x = 0; for (let i = 0; i < a.length; i++) x += a[i]; return x; };
    o.sum = s(o.load); o.sOn = s(o.onwind); o.sSol = s(o.solar); o.sOff = s(o.offwind);
    this._arr = o;
    return o;
  }

  feasible(A, x, rule, share, gridOn, batH, eta, data, full) {
    const n = A.load.length;
    const nav = this.nucAvail(x.nuclear, A.seed, A.refuelLen);
    if (rule === 'annual') {
      let nsum = 0; for (let t = 0; t < n; t++) nsum += (t >= A.refuel && t < A.refuel + A.refuelLen) ? 0 : nav[t];
      const ann = (x.onwind * A.sOn + x.solar * A.sSol + x.offwind * A.sOff + x.nuclear * nsum) / A.sum;
      if (ann < share - 1e-9) return null;
      if (gridOn && !full && false) return { gas: 0, imp: 0, impW: 0, exp: 0 };
    }
    let gasTot = 0, impTot = 0, expTot = 0, impW = 0, impCost = 0, expRev = 0, nucTot = 0;
    const price = A.price;
    const P = x.battery, E = P * batH;
    const gch = gridOn && A.batGrid && E > 0;
    let soc = 0, socG = 0, short = 0;
    const allowed = rule === 'hourly' ? (1 - share) * A.sum + 1e-6 : Infinity;
    let Lf = null;
    if (A.flex > 0) {
      const G0 = new Float64Array(n);
      for (let t = 0; t < n; t++) { const off = t >= A.refuel && t < A.refuel + A.refuelLen; G0[t] = x.onwind * A.onwind[t] + x.solar * A.solar[t] + x.offwind * A.offwind[t] + x.nuclear * (off ? 0 : nav[t]); }
      Lf = this.flexShift(Float64Array.from(A.load), G0, A.flex);
    }
    for (let t = 0; t < n; t++) {
      const load = Lf ? Lf[t] : A.load[t];
      const night = (t % 24) >= 22 || (t % 24) < 6;
      const nv = (t >= A.refuel && t < A.refuel + A.refuelLen) ? 0 : nav[t];
      const G = x.onwind * A.onwind[t] + x.solar * A.solar[t] + x.offwind * A.offwind[t] + x.nuclear * nv;
      let imp = 0;
      if (G >= load) {
        let ch = 0;
        if (E > 0) { ch = Math.max(0, Math.min(G - load, P, (E - soc - socG) / eta)); soc += ch * eta; }
        if (gridOn) {
          const e = Math.min(G - load - ch, A.expCap);
          expRev += e * price[t];
          expTot += e;
        }
        if (gch && night) { const cg = Math.max(0, Math.min(P - ch, (E - soc - socG) / eta)); socG += cg * eta; imp += cg; }
      } else {
        let need = load - G;
        let disC = 0, disG = 0;
        if (E > 0) {
          disC = Math.max(0, Math.min(need, P, soc * eta)); soc -= disC / eta; need -= disC;
          disG = gch && night ? 0 : Math.max(0, Math.min(need, P - disC, socG * eta)); socG -= disG / eta;
        }
        short += need;
        if (short > allowed) return null;
        need -= disG;
        const g = Math.min(need, x.gas);
        gasTot += g;
        need -= g;
        if (!gridOn && need > 0.5) return null;
        if (gridOn && need > A.impCap + 0.5) return null;
        if (need > 0) imp += need;
        if (gch && night) { const cg = Math.max(0, Math.min(P - disC - disG, (E - soc - socG) / eta)); socG += cg * eta; imp += cg; }
      }
      impTot += imp; impW += night ? imp * 0.3 : imp; impCost += imp * price[t]; nucTot += x.nuclear * nv;
    }
    return { gas: gasTot, imp: impTot, impW: impW, exp: expTot, impCost: impCost, expRev: expRev, nuc: nucTot };
  }

  optimize(data, c, M, set) {
    const A = this.arrays(data);
    A.seed = c.seed;
    A.batGrid = c.batGrid;
    A.impCap = c.impCap; A.expCap = c.expCap; A.refuel = c.refuel; A.refuelLen = c.refuelLen; A.flex = c.flex;
    const eta = data.battery.efficiency_one_way;
    const gridOn = c.grid === 'on';
    const rule = c.matching;
    const share = c.share / 100;
    const kind = (this.state && this.state.optSet) || 'renewable';
    const cc = M.cap;
    const fixed = (x) => x.onwind * cc.onwind + x.solar * cc.solar + x.offwind * cc.offwind + x.nuclear * cc.nuclear + x.battery * cc.battery + x.gas * cc.gas;
    const gasPrice = M.gas.srmc;
    const useNuclear = kind !== 'renewable';
    const useGas = kind === 'calm' && !gridOn;
    const calm = kind === 'calm';
    // Least angry: the same made-up anger score as the meter, summed over plants, cost, gas and grid use.
    const nh = A.load.length;
    const ch = this.charOf(this.state || {});
    const md = Object.assign({ renew: 1, gas: 1, nuclear: 1, cfo: 1, bills: 1 }, ch ? ch.mod : {});
    const base = (x, f) => calm ? ((x.onwind / 26 + x.offwind / 40 + x.solar / 40) * md.renew + this.nucAnger(x.nuclear) * md.nuclear + (f / 20e6) * md.cfo) : f;
    const runC = (r) => r.gas * gasPrice + r.nuc * M.nuclearVar + r.impCost + r.imp * M.tax.netEnergy - r.expRev * paidExportShare(r.exp, colocationTerms.exportShare * A.sum);
    const total = (x, f, r) => calm ? base(x, f) + (runC(r) / 20e6) * md.cfo + ((r.gas / nh) / 6) * md.gas + ((r.impW / nh) / 2.5) * md.bills - Math.min(30, (r.exp / nh) / 8) : f + runC(r);
    let pmax = 0; for (let t = 0; t < A.price.length; t++) pmax = Math.max(pmax, A.price[t]);
    const slack = calm ? (gridOn ? 30 + (colocationTerms.exportShare * A.sum * pmax / 20e6) * md.cfo : 0) : (gridOn ? colocationTerms.exportShare * A.sum * pmax : 0);
    const range = (a, b, st) => { const r = []; for (let v = a; v <= b + 1e-9; v += st) r.push(v); return r; };
    const L = {
      onwind: range(0, 2400, 200), solar: range(0, 2000, 250), offwind: range(0, 1500, 250),
      nuclear: useNuclear ? range(0, 600, 100) : [0], battery: range(0, 800, 100), gas: useGas ? range(0, 400, 50) : [0]
    };
    const combos = [];
    L.onwind.forEach((a) => L.solar.forEach((b) => L.offwind.forEach((d) => L.nuclear.forEach((e) => L.battery.forEach((f) => L.gas.forEach((g) => {
      const x = { onwind: a, solar: b, offwind: d, nuclear: e, battery: f, gas: g };
      const fx = fixed(x);
      combos.push({ x: x, f: fx, b: base(x, fx) });
    }))))));
    combos.sort((p, q) => p.b - q.b);
    let best = null, bestCost = Infinity;
    for (let i = 0; i < combos.length; i++) {
      if (combos[i].b - slack >= bestCost) break;
      const r = this.feasible(A, combos[i].x, rule, share, gridOn, c.batH, eta, data, calm);
      if (!r) continue;
      const tot = total(combos[i].x, combos[i].f, r);
      if (tot < bestCost) { bestCost = tot; best = combos[i].x; }
    }
    if (!best) return null;
    // Refine in small steps: remove a step, or move a step from one technology to another.
    const steps = { onwind: 50, solar: 50, offwind: 50, nuclear: 50, battery: 25, gas: 25 };
    const techs = ['onwind', 'solar', 'offwind', 'battery'].concat(useNuclear ? ['nuclear'] : []).concat(useGas ? ['gas'] : []);
    let cur = Object.assign({}, best), curCost = bestCost;
    for (let it = 0; it < 400; it++) {
      let moved = false;
      for (let i = 0; i < techs.length && !moved; i++) {
        const ti = techs[i];
        if (cur[ti] <= 0) continue;
        const cands = [null].concat(techs.filter((t) => t !== ti));
        for (let j = 0; j < cands.length && !moved; j++) {
          const x = Object.assign({}, cur);
          x[ti] = Math.max(0, x[ti] - steps[ti]);
          if (cands[j]) { const tj = cands[j]; x[tj] = x[tj] + steps[tj]; if (x[tj] > M.t[tj].max) continue; }
          const f = fixed(x);
          if (base(x, f) - slack >= curCost) continue;
          const r = this.feasible(A, x, rule, share, gridOn, c.batH, eta, data, calm);
          if (!r) continue;
          const tot = total(x, f, r);
          if (tot < curCost - (calm ? 0.01 : 1)) { cur = x; curCost = tot; moved = true; }
        }
      }
      if (!moved) break;
    }
    return { x: cur, cost: curCost, fixedCost: fixed(cur) };
  }

  smoothChart(r, startF, M) {
    const w = M.win, W = 360, H = 150, top = 6, ymax = 1000, n = r.load.length;
    const i0 = Math.max(0, Math.floor(startF)), i1 = Math.min(n - 1, Math.ceil(startF + w - 1));

    const layers = [
      { key: 'nuclear', vals: r.gen.nuclear }, { key: 'onwind', vals: r.gen.onwind }, { key: 'offwind', vals: r.gen.offwind },
      { key: 'solar', vals: r.gen.solar }, { key: 'battery', vals: r.dis }, { key: 'gas', vals: r.gas }
    ];
    const cnt = i1 - i0 + 1;
    const cum = new Array(cnt).fill(0);
    const paths = {};
    layers.forEach((L) => {
      const bot = cum.slice();
      for (let j = 0; j < cnt; j++) cum[j] += L.vals[i0 + j];
      let p = 'M' + x(i0) + ',' + y(cum[0]);
      for (let j = 1; j < cnt; j++) p += 'L' + x(i0 + j) + ',' + y(cum[j]);

      let p = 'M' + x(i0) + ',' + y(hi(i0));

      for (let j = cnt - 1; j >= 0; j--) p += 'L' + x(i0 + j) + ',' + y(lo(i0 + j));
      return p + 'Z';
    };
    paths.imp = band((h) => r.load[h] - r.uns[h], (h) => r.load[h] - r.uns[h] - r.imp[h]);
    paths.deficit = band((h) => r.load[h], (h) => r.load[h] - r.uns[h]);

      else if (h % 6 === 0) ticks += 'M' + x(h) + ',' + (h % 24 === 12 ? 146 : 152) + 'L' + x(h) + ',160';
    }
    return { paths: paths, mid: mid || 'M-5,0L-5,0', ticks: ticks || 'M-5,0L-5,0' };
  }

    if (f === 1) return cap;
    const o = {};
    Object.keys(cap).forEach((k) => { o[k] = cap[k] * f; });
    return o;
  }

  charOf(s) {
    return this.chars().find((x) => x.key === s.char) || null;
  }

  // Sum of an hourly series over the week ending at hour h (wraps around new year).
  weekSum(cum, h) {
    const n = cum.length - 1, a = h - 167;
    if (a >= 0) return cum[h + 1] - cum[a];
    return cum[h + 1] + cum[n] - cum[n + a];
  }

  // The least capacity of a kind you can go down to. Before opening: none. After: what you had a week ago.
  mwFloor(k, s, c) {
    if (!s.started) return 0;
    const h = this._mwHist && this._mwHist[k];
    if (!h) return c.mw[k];
    const T = (s.gameT || 0) - 168;
    let v = h[0][1];
    for (const [t, x] of h) { if (t <= T) v = x; else break; }
    return Math.min(v, c.mw[k]);
  }

  // Nuclear capacity ordered after opening and still being built, MW.
  nucPend(s) {
    return (s.nucBuild || []).reduce((a, b) => a + b.mw, 0);
  }

  extrasNow(s) {
    const t = s.gameT || 0;
    return (s.extras || []).filter((e) => e.until > t);
  }

  plantCost(data, c, M) {
    let cost = 0;
    Object.keys(M.cap).forEach((k) => { cost += c.mw[k] * M.cap[k]; });
    return cost + (c.gridFee || 0) + (c.flexFee || 0);
  }

  // Running costs and grid trade for the year, EUR.
  running(d, M, c) {
    const sm = d.r.sum;
    const o = { fuel: sm.gas * M.gas.srmc + sm.nuc * M.nuclearVar, grid: sm.impCost, exported: sm.expRev * paidExportShare(sm.exp, colocationTerms.exportShare * sm.load) };
    o.tax = M.tax.energy * Math.max(0, sm.load - sm.uns);
    o.net = (c && c.gridTier ? c.impCap * M.tax.netCap : 0) + sm.imp * M.tax.netEnergy;
    o.all = o.fuel + o.grid + o.tax + o.net;
    return o;
  }

  // Made-up anger score. Plants anger people all the time, operations over the past week.
  // Nuclear sceptics react to having nuclear at all, more than to its size: a plant takes little
  // land, so more reactors add less anger. Square root of the size, 10 points at 300 MW, about 4 for a single 50 MW module.
  nucAnger(mw) {
    return mw > 0 ? 10 * Math.sqrt(mw / 300) : 0;
  }

  anger(data, c, M, d, hour, s) {
    const r = d.r;
    const extra = this.extrasNow(s).reduce((x, e) => x + e.amount, 0);
    const run = this.running(d, M, c);
    const cost = this.plantCost(data, c, M) + run.all - run.exported + extra;
    // While you design, before the first press of play, nobody is angry yet.
    if (!s.started) return { pub: 0, parts: [], raw: 0, calm: 0, adCalm: 0, expCalm: 0, cookCalm: 0, total: 0, cost: cost, extra: extra };
    const wl = this.weekSum(r.cum.load, hour);
    const uns = this.weekSum(r.cum.uns, hour) / wl;
    const ch = this.charOf(s);
    const md = Object.assign({ renew: 1, gas: 1, nuclear: 1, cust: 1, ad: 1, cfo: 1, fine: 1, bills: 1 }, ch ? ch.mod : {});
    const parts = [
      { label: 'Wind turbine neighbours', v: (c.mw.onwind / 26) * md.renew, pub: true },
      { label: 'Summer-house owners', v: (c.mw.offwind / 40) * md.renew, pub: true },
      { label: 'Farmers', v: (c.mw.solar / 40) * md.renew, pub: true },
      { label: 'Nuclear sceptics', v: (this.nucAnger(c.mw.nuclear) + (c.mw.nuclear > 0 && this.weekSum(r.cum.nucLost, hour) > 1 ? 14 : 0)) * md.nuclear, pub: true },
      { label: 'Climate activists', v: (this.weekSum(r.cum.gas, hour) / 168 / 6) * md.gas, pub: true },
      { label: 'Neighbours with higher power bills', v: (this.weekSum(r.cum.impW, hour) / 168 / 2.5) * md.bills, pub: true },
      { label: s.en && s.en.left == null ? 'Epistemic Noise' : 'Your customers', v: uns < 0.98 ? uns * 60 * md.cust : 0 },
      { label: 'Your CFO', v: (cost / 1e6 / 20) * md.cfo }
    ];
    {
      const gap = this.policyGap(c, d);
      // Regulator pressure builds up over a quarter below the policy.
      const ramp = Math.min(1, (s.regH || 0) / 720);
      if (gap > 0.05 && ramp * Math.min(25, 3 + gap * 0.8) >= 0.5) parts.push({ label: 'Regulators', v: ramp * Math.min(25, 3 + gap * 0.8) });
    }
    // A post angers some groups and pleases others, fading over three weeks.
    if (s.tweet && (s.gameT || 0) - s.tweet.t0 < 504) {
      const f = 1 - ((s.gameT || 0) - s.tweet.t0) / 504;
      for (const [label, v] of (s.tweet.eff || [['Your CFO', -3]])) {
        const p = parts.find((x) => x.label === label);
        if (v > 0) { if (p) p.v += v * f; else parts.push({ label, v: v * f, pub: label !== 'Your CFO' && label !== 'Your staff' }); }
        else if (p) p.v = Math.max(0, p.v + v * f);
      }
    }
    if (s.hall && s.hall.building) parts.push({ label: 'Neighbours of the building site', v: 8, pub: true });
    const t = s.gameT || 0;
    const ad = s.campaign;
    let calm = 0, backlash = 0;
    if (ad) {
      if (ad.busted) backlash = 20 * Math.max(0, 1 - (t - ad.tr) / 1344);
      else calm = ad.calm * md.ad * Math.max(0, 1 - (t - ad.t0) / 672);
    }
    // A cookout outside the fence, paid for by you.
    let cookCalm = 0;
    let cookAngry = 0;
    if (s.cookout) {
      // Sten's wild game sausages cost more and calm more, over the same four weeks.
      const f = Math.max(0, 1 - (t - s.cookout.t0) / 168);
      if (s.cookout.vegan || s.cookout.lab) cookAngry = 6 * f; else cookCalm = (s.cookout.game ? 25 : 15) * f;
    }
    calm += cookCalm;
    // Power sold to the grid lowers prices nearby, which calms people.
    const expCalm = Math.min(30, this.weekSum(r.cum.exp, hour) / 168 / 8);
    calm += expCalm;
    if (backlash > 0.5) parts.push({ label: 'People who feel lied to', v: backlash, pub: true });
    if (s.en && t - s.en.t0 < 1344) parts.push({ label: 'Customers you threw out', v: 25 * (1 - (t - s.en.t0) / 1344) });
    if (s.leak && t - s.leak.t0 < 1344) parts.push({ label: 'People worried about their data', v: 22 * (1 - (t - s.leak.t0) / 1344), pub: true });
    if (cookAngry > 0.5) parts.push({ label: s.cookout.lab ? 'People who did not want lab-grown meat' : 'People who wanted real hot dogs', v: cookAngry, pub: true });
    const pos = parts.filter((p) => p.v >= 0.5).sort((x, y) => y.v - x.v);
    const raw = pos.reduce((x, p) => x + p.v, 0);
    // Opinion builds up over the first ten days after opening, then follows events day by day.
    const u = Math.min(1, t / 240), warm = u * u * (3 - 2 * u);
    // The meter is full at 80 points: what is shown, and the thresholds, use points times 1.25.
    const K = 1.25;
    const total = Math.max(0, raw - calm) * warm * K;
    const pub = Math.max(0, pos.filter((p) => p.pub).reduce((x, p) => x + p.v, 0) - calm) * warm;
    return { warm: warm * K, pub: pub, parts: pos, raw: raw, calm: calm, adCalm: calm - expCalm - cookCalm, expCalm: expCalm, cookCalm: cookCalm, total: total, cost: cost, extra: extra };
  }

  // How far below the policy the plants are, in percentage points. Only counts with a grid
  // connection: off the grid you throttle instead, so the regulator has nothing to say.
  policyGap(c, d) {
    if (c.matching === 'none' || c.grid !== 'on') return 0;
    const sm = d.r.sum;
    const shown = c.matching === 'annual' ? this.annualMatched(sm, c) : this.hourlyMatched(sm, c);
    return Math.max(0, c.share - shown * 100);
  }

  // Own production over the year against use. What counts depends on the level:
  // gas included, fossil-free (wind, solar, nuclear) or renewable (wind, solar).
  annualMatched(sm, c) {
    const made = c.counts === 'ren' ? sm.ren : c.counts === 'any' ? sm.gen + sm.gas : sm.gen;
    return sm.load > 0 ? made / sm.load : 0;
  }

  // Own power used in the same hour against use. What counts depends on the level.
  hourlyMatched(sm, c) {
    const made = c.counts === 'ren' ? sm.cleanRen : c.counts === 'any' ? sm.cleanAll : sm.clean;
    return sm.load > 0 ? made / sm.load : 0;
  }

  claimCheck(ad, d, M) {
    const sm = d.r.sum;
    if (ad.key === 'digital') return { ok: true };
    if (ad.key === 'jobs') return { ok: false, why: 'Datacenters need few permanent staff. The jobs claim does not hold up.' };
    if (ad.key === 'fossil') {
      const kt = sm.gas * M.gas.co2 / 1000;
      return sm.gas / sm.load < 0.005 ? { ok: true } : { ok: false, why: 'You burn gas: ' + this.fmt(kt) + ' kt of CO2 a year.' };
    }
    // The renewable ad accepts grid electricity in this Swedish scenario.
    // This is separate from the matching policy, which still counts on-site generation.
    if (sm.gas > 1e-6) return { ok: false, why: 'Your gas plants supply some of the electricity.' };
    if (sm.nuc > 1e-6) return { ok: false, why: 'Your power mix includes nuclear generation.' };
    const supplied = 1 - sm.uns / sm.load;
    return supplied >= 0.9 ? { ok: true } : { ok: false, why: 'Only ' + this.fmt(supplied * 100) + ' % of the datacenter’s demand is being supplied.' };
  }

  // What the month is expected to land on: every hour of the month in the weather year,
  // with the current mix, occupancy and prices, plus one-time charges already booked this month.
  monthForecast(data, c, M, dispatch, mi) {
    const terms = colocationTerms;
    const budget = this.hallBudget(M);
    const yearHours = data.year.load.length;
    const fixedPowerCost = Object.entries(M.cap).reduce((sum, [key, rate]) => sum + c.mw[key] * rate, 0);
    const reservedGridCost = c.gridTier ? c.impCap * M.tax.netCap : 0;
    const rented = this.accounts.rentedRacks;
    const h0 = M.monthStart[mi] * 24, h1 = M.monthStart[mi + 1] * 24, monthHours = h1 - h0;
    const share = paidExportShare(dispatch.sum.exp, terms.exportShare * dispatch.sum.load);
    const rev = { 'Capacity rent': 0, 'Service credits': 0, 'Electricity billed to customers': 0, 'Grid power sold': 0 };
    // power first, by plant type, then the grid and tax, then the hall itself
    const names = { onwind: 'Onshore wind', solar: 'Solar', offwind: 'Offshore wind', nuclear: 'Nuclear, incl. fuel', battery: 'Battery', gas: 'Gas, incl. fuel' };
    const cost = {};
    for (const k of ['onwind', 'solar', 'offwind', 'nuclear', 'battery', 'gas']) cost[names[k]] = 0;
    Object.assign(cost, { 'Grid power bought': 0, 'Network fees': 0, 'Grid connection': 0, 'Energy tax': 0, 'Software': 0, 'Datacenter operations': 0 });
    if (terms.includeBuildingCost) cost['Datacenter capital'] = 0;
    for (let hour = h0; hour < h1 && hour < yearHours; hour++) {
      const load = dispatch.load[hour], unserved = dispatch.uns[hour], imported = dispatch.imp[hour], price = data.year.price[hour];
      const fee = budget.monthlyRentPerRack * this.accounts.rentUnits / monthHours;
      rev['Capacity rent'] += fee;
      rev['Service credits'] -= fee * (load > 0 ? Math.min(1, Math.max(0, unserved / load)) : 0);
      rev['Electricity billed to customers'] += (load - unserved) * terms.electricityPerMWh;
      rev['Grid power sold'] += dispatch.exp[hour] * price * share;
      if (terms.includeBuildingCost) cost['Datacenter capital'] += budget.annualCapital / yearHours;
      cost['Datacenter operations'] += budget.annualOperations / yearHours;
      for (const k of ['onwind', 'solar', 'offwind', 'nuclear', 'battery', 'gas']) cost[names[k]] += (c.mw[k] || 0) * (M.cap[k] || 0) / yearHours;
      cost[names.gas] += dispatch.gas[hour] * M.gas.srmc;
      cost[names.nuclear] += dispatch.gen.nuclear[hour] * M.nuclearVar;
      cost['Grid connection'] += (c.gridFee || 0) / yearHours;
      cost['Software'] += (c.flexFee || 0) / yearHours;
      cost['Grid power bought'] += imported * price;
      cost['Network fees'] += reservedGridCost / yearHours + imported * M.tax.netEnergy;
      cost['Energy tax'] += (load - unserved) * M.tax.energy;
    }
    const oneTime = this.accounts.month.cost['One-time charges'] || 0;
    if (oneTime) cost['One-time charges'] = oneTime;
    return { revenue: rev, cost };
  }

  recordOperatingHours(data, c, M, dispatch, startHour, gameT, hours) {
    const budget = this.hallBudget(M);
    const st = this.accounts.stats;
    const yearHours = data.year.load.length;
    const fixedPowerCost = Object.entries(M.cap).reduce((sum, [key, rate]) => sum + c.mw[key] * rate, 0);
    const reservedGridCost = c.gridTier ? c.impCap * M.tax.netCap : 0;
    const customerSensitivity = this.charOf(this.state || {})?.mod.cust || 1;
    for (let i = 0; i < hours; i++) {
      const hour = (startHour + i) % yearHours;
      const { mi: month, label: date } = this.dateOf(hour, M);
      const monthHours = (M.monthStart[month + 1] - M.monthStart[month]) * 24;
      const load = dispatch.load[hour];
      const unserved = dispatch.uns[hour];
      const imported = dispatch.imp[hour];
      const price = data.year.price[hour];
      this.accounts.recordHour({
        month, monthHours, yearHours,
        nextMonth: this.dateOf((hour + 1) % yearHours, M).mi,
        elapsed: gameT - hours + i + 1,
        budget, load, unserved, price, date, customerSensitivity,
        exported: dispatch.exp[hour],
        // money that follows the power this hour, for the marks on the week chart
        hourOfYear: hour,
        flows: { bought: imported * (price + M.tax.netEnergy), gas: dispatch.gas[hour] * M.gas.srmc, nuclear: dispatch.gen.nuclear[hour] * M.nuclearVar },
        exportAllowance: colocationTerms.exportShare * dispatch.sum.load,
        exportForecast: dispatch.sum.exp,
        cost: {
          'Power plants and battery': fixedPowerCost / yearHours,
          // connection fee and software are spread over the year like the plants, not charged in one month
          'Grid connection': (c.gridFee || 0) / yearHours,
          'Software': (c.flexFee || 0) / yearHours,
          'Gas and nuclear running costs': dispatch.gas[hour] * M.gas.srmc + dispatch.gen.nuclear[hour] * M.nuclearVar,
          'Grid power bought': imported * price,
          'Network fees': reservedGridCost / yearHours + imported * M.tax.netEnergy,
          'Energy tax': (load - unserved) * M.tax.energy
        }
      });
      st.load += load; st.served += load - unserved; st.clean += dispatch.clean[hour]; st.gas += dispatch.gas[hour]; st.imported += imported;
      {
        // for the year review's lessons: market value of your own power, prices bought and sold, gas
        const L = this.accounts.learn || (this.accounts.learn = { hours: 0, price: 0, gen: {}, boughtMwh: 0, boughtCost: 0, soldMwh: 0, soldGross: 0, gasMwh: 0, gasHours: 0, gasPrice: 0 });
        L.hours += 1; L.price += price;
        for (const k of ['onwind', 'offwind', 'solar', 'nuclear']) { const g = dispatch.gen[k][hour] || 0; const o = L.gen[k] || (L.gen[k] = { mwh: 0, value: 0 }); o.mwh += g; o.value += g * price; }
        L.boughtMwh += imported; L.boughtCost += imported * price;
        L.soldMwh += dispatch.exp[hour]; L.soldGross += dispatch.exp[hour] * price;
        const gz = dispatch.gas[hour]; if (gz > 0) { L.gasMwh += gz; L.gasHours += 1; L.gasPrice += gz * price; }
      }
      if (unserved > colocationTerms.throttleThresholdMW) st.throttledHours += 1;
    }
  }

  tick() {
    const s = this.state || {};
    const M = this.meta();
    const sp = M.speeds.find((x) => x.key === (s.speed || 1)) || M.speeds[0];
    const f = (s.frame || 0) + 1;
    const previousHour = s.hour == null ? 12 : s.hour;
    // One round is one year: the clock stops at the last hour of December 31.
    if (s.started && previousHour >= 8759) {
      if (!s.yearDone && s.data) {
        // Book the last hour of the year, which closes the fourth quarter.
        const c = this.cfg();
        this.recordOperatingHours(s.data, c, M, this.derived(s.data, c, M).r, 8759, (s.gameT || 0) + 1, 1);
      }
      this.stop();
      this.setState({ playing: false, yearDone: true, modal: { kind: 'yearend' } });
      return;
    }
    const adv = Math.min(sp.fph > 1 ? (f % sp.fph === 0 ? 1 : 0) : sp.hpf, 8759 - previousHour);
    const hour = (previousHour + adv) % 8760;
    const gameT = (s.gameT || 0) + adv;
    const up = { frame: f, hour: hour, gameT: gameT };
    if (hour < previousHour) { up.refuelAt = null; up.rfWarned = false; }
    if (s.data) {
      const m = s.data.year;
      this._rot = this._rot || { onwind: 0, offwind: 0 };
      this._rot.onwind = (this._rot.onwind + 10 * m.onwind[hour]) % 360;
      this._rot.offwind = (this._rot.offwind + 10 * m.offwind[hour]) % 360;
      // the sailboat: 0 to 1 is the trip to the left, 1 to 2 the trip back. Becalmed when there is no wind.
      this._sail = this._sail || { p: 0.7 };
      this._sail.p = (this._sail.p + 0.008 * m.onwind[hour]) % 2;
      if (adv > 0) {
        const c = this.cfg();
        const d = this.derived(s.data, c, M);
        const previousTenantChange = this.accounts.lastTenantChange;
        this.recordOperatingHours(s.data, c, M, d.r, previousHour, gameT, adv);
        const change = this.accounts.lastTenantChange;
        if (change !== previousTenantChange) {
          up.tenantNotice = change;
          setTimeout(() => {
            if (this.state.tenantNotice === change) this.setState({ tenantNotice: null });
          }, 1000);
        }
        // Money from power sold, bought and burnt since the last marks, at most every five seconds.
        const flow = this.accounts.flow;
        const nowMs = performance.now();
        if (flow.hours >= 12 && nowMs - (this._popAt || 0) > 5000) {
          this._popAt = nowMs;
          const names = { sold: 'Sold', bought: 'Bought', gas: 'Gas', nuclear: 'Nuclear fuel' };
          // marks appear where the playhead stands, and stay at that hour. Power sold and bought show as one net mark.
          const atNow = (previousHour + adv) % this._n;
          const net = flow.sold.v - flow.bought.v;
          const items = [{ k: net >= 0 ? 'sold' : 'bought', label: '', v: net, at: atNow }]
            .concat([{ k: 'fuel', label: 'Fuel', v: -(flow.gas.v + flow.nuclear.v), at: atNow }])
            .filter((x) => Math.abs(x.v) >= 5e3);
          const pop = { items, now: gameT };
          this.accounts.resetFlow();
          if (items.length) up.moneyPop = pop;
          setTimeout(() => { if (this.state.moneyPop === pop) this.setState({ moneyPop: null }); }, 3300);
        }
        // A new module is finished after a week. Its racks stand empty and fill with customers.
        if (s.hall && s.hall.building && gameT >= s.hall.building.end) {
          this.accounts.addModule();
          this.accounts.logEvent(gameT, '🏗️');
          up.hall = null;
          const note = { t: gameT };
          up.hallNotice = note;
          setTimeout(() => { if (this.state.hallNotice === note) this.setState({ hallNotice: null }); }, 2400);
        }
        if (s.nucBuild && s.nucBuild.some((b) => gameT >= b.at)) {
          const done = s.nucBuild.filter((b) => gameT >= b.at), rest = s.nucBuild.filter((b) => gameT < b.at);
          const mw = Object.assign({}, up.mw || s.mw);
          mw.nuclear = (mw.nuclear || 0) + done.reduce((a, b) => a + b.mw, 0);
          const h = (this._mwHist = this._mwHist || {}); (h.nuclear = h.nuclear || [[-Infinity, s.mw.nuclear]]).push([gameT, mw.nuclear]);
          Object.assign(up, { mw, nucBuild: rest });
          this.accounts.logEvent(gameT, '⚛️');
        }
        if (s.gridPending && gameT >= s.gridPending.at) {
          Object.assign(up, { gridTier: s.gridPending.key, grid: 'on', gridPending: null });
          this.accounts.logEvent(gameT, '🔌');
        }
        const st = Object.assign({}, s, up);
        const a = this.anger(s.data, c, M, d, hour, st);
        let fury = s.furyH || 0;
        fury = a.total >= 100 && a.pub >= 50 ? fury + adv : Math.max(0, fury - adv * 0.5);
        up.furyH = fury;
        const gapNow = this.policyGap(c, d);
        up.regH = gapNow > 0.05 ? (s.regH || 0) + adv : Math.max(0, (s.regH || 0) - adv * 2);
        const regDue = gameT - (s.regT || 0) >= 720;
        if (regDue) { up.regT = gameT; up.regStrikes = gapNow > 0.05 ? (s.regStrikes || 0) + 1 : 0; }
        const gap = regDue ? gapNow : 0;
        {
          // The offer comes after six weeks of trouble: below the hourly policy, or throttling.
          // Never in the first two months, and two months after you say no.
          const wl = this.weekSum(d.r.cum.load, hour), wu = this.weekSum(d.r.cum.uns, hour) / wl;
          const below = c.matching === 'hourly' && this.hourlyMatched(d.r.sum, c) * 100 < c.share - 0.5;
          up.flexH = below || wu > 0.02 ? (s.flexH || 0) + adv : Math.max(0, (s.flexH || 0) - adv);
          if (!s.flexPaid && s.flexOffered == null && gameT >= 672 && up.flexH >= 336 && gameT - (s.flexNo == null ? -1e9 : s.flexNo) >= 1008) up.flexOffered = gameT;
        }
        // Epistemic Noise: once a week there is a chance it leaves, larger after a week with throttling.
        let enLeave = null;
        if (s.en && s.en.left == null && gameT - s.en.t0 >= colocationTerms.anchorGraceHours && Math.floor(gameT / 168) > Math.floor((s.gameT || 0) / 168)) {
          const { share, chance } = this.accounts.anchorLeaveChance();
          if (Math.random() < chance) {
            // Epistemic Noise gives back part of what it rents instead of leaving the hall empty.
            const cut = this.accounts.shrinkAnchor(gameT, this.dateOf(hour, M).label, share > 0.005);
            this.accounts.logEvent(gameT, '🚪');
            enLeave = { share };
            up.en = Object.assign({}, s.en, { left: cut.gone ? gameT : null, throttled: share > 0.005, share: share, cut: cut.racks, cuts: (s.en.cuts || 0) + 1 });
          }
        }
        // ShiftCloud has all your data. Each month there is an 8 % chance that it leaks.
        const leakNow = s.flexOn && !s.leak && Math.floor((gameT - s.flexT0) / 720) > Math.floor(((s.gameT || 0) - s.flexT0) / 720) && Math.random() < 0.08;
        if (leakNow) { up.leak = { t0: gameT }; this.accounts.logEvent(gameT, '💧'); }
        const RF = M.refuel;
        const rfRemind = false && s.refuelAt == null && !s.rfWarned && hour >= RF.deadline - RF.warn && hour < RF.deadline;
        if (rfRemind) up.rfWarned = true;
        if (fury >= 720) {
          this.stop();
          Object.assign(up, { playing: false, shutdown: true, modal: { kind: 'shutdown' } });
        } else if (enLeave) {
          this.stop();
          Object.assign(up, { playing: false, resume: true, modal: { kind: 'enleft' } });
        } else if (gap > 0.05) {
          // First quarter below the policy: a warning. After that, fines that grow each quarter.
          const strikes = up.regStrikes;
          const fine = strikes <= 1 ? 0 : Math.max(2, Math.round(gap * 0.5 * (strikes - 1))) * 1e6;
          if (fine > 0) {
            this.accounts.stats.fines += fine; this.accounts.logEvent(gameT, '⚖️');
            this.accounts.book('cost', { 'One-time charges': fine });
            up.extras = this.extrasNow(st).concat([{ label: 'regulator fine', amount: fine, until: gameT + 2184 }]);
          }
          this.stop();
          Object.assign(up, { playing: false, resume: true, modal: { kind: 'reg', gap: this.fmt(gap, 1), fine: this.fmt(fine / 1e6), warn: fine === 0 } });
        } else if (up.leak || (s.leak && !s.leak.resolved)) {
          this.stop();
          Object.assign(up, { playing: false, resume: true, modal: { kind: 'leak' } });
        } else if (rfRemind) {
          this.stop();
          Object.assign(up, { playing: false, resume: true, modal: { kind: 'refuel' } });
        } else if (s.campaign && !s.campaign.reviewed && gameT - s.campaign.t0 >= 336) {
          const ad = this.ads().find((x) => x.key === s.campaign.key);
          const res = this.claimCheck(ad, d, M);
          const camp = Object.assign({}, s.campaign, { reviewed: true, ok: res.ok });
          if (!res.ok) { this.accounts.stats.busted += 1; this.accounts.stats.fines += 12.5e6 * (this.charOf(s)?.mod.fine || 1); this.accounts.logEvent(gameT, '⚖️'); }
          const fine = res.ok ? 0 : 12.5e6 * (this.charOf(s)?.mod.fine || 1);
          if (!res.ok) {
            camp.busted = true; camp.tr = gameT;
            this.accounts.book('cost', { 'One-time charges': fine });
            up.extras = this.extrasNow(st).concat([{ label: 'fine', amount: fine, until: gameT + 2184 }]);
          }
          this.stop();
          Object.assign(up, { campaign: camp, playing: false, resume: true, modal: { kind: 'review', ok: res.ok, why: res.why || '', name: ad.name, fine } });
        }
      }
    }
    this.setState(up);
  }

  togglePlay() {
    if ((this.state || {}).yearDone) { this.setState({ modal: { kind: 'yearend' } }); return; }
    if (this._timer) {
      clearInterval(this._timer); this._timer = null; this.setState({ playing: false }); return;
    }
    if ((this.state || {}).shutdown) return;
    this._timer = setInterval(() => this.tick(), 40);
    this.setState({ playing: true, started: true, viewStart: null, previewHour: null });
  }

  stop() {
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
  }

  closeModal() {
    const s = this.state || {};
    const resume = !!s.resume && !s.shutdown;
    this.setState({ modal: null, resume: false });
    if (resume && !this._timer) { this._timer = setInterval(() => this.tick(), 40); this.setState({ playing: true }); }
  }

  resolveLeak(inHouse) {
    const s = this.state;
    if (s.modal?.kind !== 'leak' || !s.leak || s.leak.resolved) return;
    if (inHouse) this.accounts.book('cost', { 'One-time charges': this.meta().flexInHouseCost });
    this.setState({ flexOn: inHouse, leak: { ...s.leak, resolved: true } });
    this.closeModal();
  }


  // The hall on the map, and the next expansion.
  hallView(s, M, led, throttled, mood) {
    const terms = colocationTerms;
    const balance = this.accounts;
    const t = s.gameT || 0;
    const building = s.hall && s.hall.building ? s.hall.building : null;
    const built = balance.builtModules;
    const full = balance.fullSize;
    // The lightning stays on for at least four seconds after the last throttled hour.
    const nowMs = typeof performance !== 'undefined' ? performance.now() : 0;
    if (throttled) this._zapUntil = nowMs + 4000;
    const zapOn = throttled || (!!s.started && nowMs < (this._zapUntil || 0));
    const hall = { zap: zapOn ? 'zap on' : 'zap' };
    for (let k = 0; k <= terms.modules; k++) {
      hall['m' + k] = k < built ? '1' : '0';
      hall['e' + k] = k === built ? '1' : '0';
      hall['g' + k] = k >= built && !(building && k === built) ? '1' : '0';
      hall['f' + k] = building && k === built ? '1' : '0';
      hall['crane' + k] = building && k === built ? 'crane-on' : '';
    }
    balance.rackStates(t).forEach((st, i) => {
      hall['r' + i] = st === 'off' ? '0' : '1';
      hall['l' + i] = st === 'off' ? '#59605b' : led;
      hall['k' + i] = st === 'new' ? 'rk-new' : '';
    });
    // The board approves the next 100 MW when you have made enough since the last expansion
    // and public anger is below the limit.
    const goal = terms.expandProfit * ((this.charOf(s) || {}).expand || 1);
    const made = Math.max(0, balance.sinceExpansion);
    const profitOk = made >= goal;
    const anger = mood && mood.total != null ? mood.total : 0;
    const angerOk = anger < terms.expandAngerMax;
    const can = !!s.started && !s.shutdown && !s.yearDone && !building && !full && profitOk && angerOk;
    const daysLeft = building ? Math.max(1, Math.ceil((building.end - t) / 24)) : 0;
    const m = (x) => this.fmt(x / 1e6) + ' M€';
    const stepMW = terms.rackMW * terms.moduleRacks;
    const step = built - terms.phaseModules + 1;
    const steps = terms.modules - terms.phaseModules;
    // When the next customer moves in.
    const toNext = balance.hoursToNext;
    const throttledLately = balance.reletThrottledHours / terms.reletWindowHours > terms.reletThreshold;
    const nextLease = balance.nextLease;
    const nextMW = nextLease >= 0 ? terms.rackMW * leaseSizes[nextLease] : 0;
    const next = toNext == null ? 'Hall full' : throttledLately ? 'Waiting' : 'In ' + Math.max(1, Math.ceil(toNext / 24)) + ' d';
    const nextNote = toNext == null ? (full ? 'Every rack is rented.' : 'Every rack is rented. Expand the hall to take more customers.')
      : throttledLately ? 'New customers wait until you have run 6 days without power cuts.'
      : 'The next customer needs ' + nextMW + ' MW. Customers move in after ' + (terms.fillAfterHours / 24) + ' days in a row without power cuts.';
    const expand = {
      nom: this.fmt(terms.rackMW * balance.rentedRacks) + ' MW',
      next, nextNote,
      full, building: !!building, idle: !building && !full,
      title: 'Expand the hall by ' + stepMW + ' MW (' + step + ' of ' + steps + ')',
      opens: building ? 'The new module opens on ' + this.dateOf(Math.min(8759, building.endHour), M).label + '. Its racks then fill with customers like the rest.' : '',
      owner: 'The board approves the next step when:',
      profitCls: profitOk ? 'xrow ok' : 'xrow', profitText: 'Profit since the last expansion reaches ' + m(goal),
      profitBar: 'width: ' + (Math.min(1, made / goal) * 100).toFixed(0) + '%', profitVal: (balance.sinceExpansion <= -0.5e6 ? '−' + m(-balance.sinceExpansion) : m(made)) + ' of ' + m(goal),
      angerCls: angerOk ? 'xrow ok' : 'xrow', angerText: 'Public anger is below ' + terms.expandAngerMax, angerVal: 'Now ' + this.fmt(Math.min(100, anger)),
      can, cannot: !can,
      build: () => {
        if (!can) return;
        const hourNow = s.hour == null ? 12 : s.hour;
        balance.startExpansion();
        this.setState({ hall: { building: { t0: t, end: t + terms.buildHours, endHour: hourNow + terms.buildHours } } });
        this.closeModal();
      },
      showUnbuilt: !full, unbuiltCls: 'rack unbuilt',
      // the button on the map: locked, ready, or the days left
      btn: !!s.started && !full && !s.yearDone,
      btnText: building ? '🏗️ ' + daysLeft + ' d' : (can ? '' : '🔒 ') + '+ ' + stepMW + ' MW',
      btnAria: building ? 'The hall is being expanded, ' + daysLeft + ' days left' : can ? 'Expand the hall by ' + stepMW + ' MW' : 'Expand the hall: see what it takes',
      btnCls: building ? 'addb xbuild' : can ? 'addb xready' : 'addb xlock',
      micoCls: building ? 'cookbtn mico xbuild' : can ? 'cookbtn mico xready' : 'cookbtn mico xlock',
      badge: building ? daysLeft + 'd' : can ? '!' : '🔒'
    };
    const hn = s.hallNotice;
    if (hn) expand.btn = false;
    return {
      hall, expand,
      hallNotice: hn && { text: '+' + stepMW + ' MW: ' + terms.moduleRacks + ' empty racks', short: '+' + stepMW + ' MW' }
    };
  }

  // The year in review: the character's verdict, a title, the year month by month, and remarks.
  yearReview(s, M) {
    const b = this.accounts;
    const st = b.stats;
    const ch = this.charOf(s);
    const f = (x, d) => this.fmt(x, d);
    const money = (x) => (x < 0 ? '−' : '+') + f(Math.abs(x) / 1e6, 1) + ' M€';
    const monthRes = new Array(12).fill(null);
    b.months.forEach((x) => { monthRes[x.month] = x.result; });
    const total = monthRes.reduce((a, v) => a + (v || 0), 0) + (s.yearDone ? 0 : accountTotal(b.month.revenue) - accountTotal(b.month.cost));
    const top = Math.max(1, ...monthRes.map((v) => Math.abs(v || 0)));
    // Events of the year, by month.
    const evs = Array.from({ length: 12 }, () => []);
    b.events.forEach((e) => { evs[this.dateOf(Math.min(8759, e.t + 11), M).mi].push(e.icon); });
    const letters = ['J', 'F', 'M', 'A', 'M', 'J', 'J', 'A', 'S', 'O', 'N', 'D'];
    const months = monthRes.map((v, i) => {
      const a = v == null ? 0 : 0.14 + 0.5 * Math.min(1, Math.abs(v) / top);
      const col = v == null ? 'transparent' : v >= 0 ? 'rgba(92, 138, 90, ' + a.toFixed(2) + ')' : 'rgba(184, 50, 42, ' + a.toFixed(2) + ')';
      // Stacked above the month, at most three lines.
      const icons = (evs[i].length > 3 ? evs[i].slice(0, 2).concat(['+' + (evs[i].length - 2)]) : evs[i]).join('\n');
      return { letter: letters[i], style: 'background: ' + col, tip: M.monthShort[i] + (v == null ? '' : ': ' + money(v)), icons };
    });
    // Installed power over the year, racks rented times 10 MW, as a step line: 0 at the bottom, 500 MW near the top.
    const yOf = (mw) => (54 - mw / M.dcMW * 46).toFixed(1);
    let path = 'M0,' + yOf(colocationTerms.rackMW * colocationTerms.startRented);
    b.rentLog.forEach(([e, n]) => { path += 'H' + (Math.min(8759, e + 11) / 8760 * 360).toFixed(1) + 'V' + yOf(colocationTerms.rackMW * n); });
    path += 'H360';
    const quarters = [1, 2, 3, 4].map((n) => {
      const q = b.quarters.find((x) => x.number === n);
      const v = q ? q.revenue - q.cost : null;
      return { label: 'Q' + n, value: v == null ? '–' : money(v), cls: v != null && v < 0 ? 'yq neg' : 'yq' };
    });
    // Gas counts in Anything goes and Off-grid. Renewables cannot build nuclear, so clean is wind, solar and battery there.
    const matched = st.load > 0 ? Math.min(1, (s.counts === 'any' ? st.clean + st.gas : st.clean) / st.load) : 0;
    const builtMW = colocationTerms.rackMW * b.rentedRacks;
    const facts = this.yearFacts(s, M, total, matched);
    const tag = this.yearTitle(facts);
    return {
      marta: s.char === 'marta', sten: s.char === 'sten', joe: s.char === 'joe', al: s.char === 'al',
      who: ch ? ch.name : 'Your board', role: ch ? ch.title : 'DatNorth',
      quote: this.yearVerdict(s.char, facts),
      title: tag[0], titleNote: tag[1],
      resLabel: s.yearDone ? 'Result for the year' : 'Result so far this year',
      total: money(total), cls: total < 0 ? 'ytotal neg' : 'ytotal',
      months, quarters, hallPath: path,
      stripLabel: 'The year month by month: result, hall size and events',
      key: 'Months in green made money, months in red lost it. The line is the power your customers had installed.',
      stats: [
        { label: 'Installed', value: f(builtMW) + ' MW' },
        { label: s.lvlKey === 'off' ? 'Power delivered' : 'Matched each hour', value: f(matched * 100) + ' %' },
        { label: 'Hours of power cuts', value: f(st.throttledHours) + ' h' },
        { label: 'Customers lost', value: f(st.departures) }
      ],
      comments: this.yearRemarks(s, facts),
      lessons: this.yearLessons(s, M),
      hasLessons: this.yearLessons(s, M).length > 0
    };
  }

  // What the year's numbers say: the main source's market value, prices bought and sold, gas.
  yearLessons(s, M) {
    const L = this.accounts.learn;
    if (!L || L.hours < 24 * 7) return [];
    const f = (x, d) => this.fmt(x, d);
    const avg = L.price / L.hours;
    const out = [];
    const names = { onwind: 'onshore wind', offwind: 'offshore wind', solar: 'solar', nuclear: 'nuclear' };
    const icons = { onwind: '🌬️', offwind: '🌊', solar: '☀️', nuclear: '⚛️' };
    const why = {
      onwind: 'When it is windy here, it is windy everywhere, so prices drop just as your turbines spin.',
      offwind: 'Offshore wind is steadier, but it still blows when other wind farms run.',
      solar: 'All solar parks peak in the same sunny hours, and give little in winter when power is dear.',
      nuclear: 'Nuclear runs flat out whatever the price, so it gets about the average.'
    };
    const top = Object.keys(L.gen).filter((k) => L.gen[k].mwh > 1).sort((a, b) => L.gen[b].mwh - L.gen[a].mwh)[0];
    if (top) {
      const g = L.gen[top], cap = g.value / g.mwh;
      out.push({ icon: icons[top], text: 'Most of your power came from ' + names[top] + ' (' + f(g.mwh / 1000) + ' GWh). It was worth ' + f(cap) + ' €/MWh on the market, against ' + f(avg) + ' €/MWh for the year as a whole. ' + why[top] });
    }
    const pb = L.boughtMwh > 1 ? L.boughtCost / L.boughtMwh : null, ps = L.soldMwh > 1 ? L.soldGross / L.soldMwh : null;
    if (pb != null || ps != null) {
      let t;
      if (pb != null && ps != null) {
        t = 'You bought ' + f(L.boughtMwh / 1000) + ' GWh at ' + f(pb) + ' €/MWh and sold ' + f(L.soldMwh / 1000) + ' GWh at ' + f(ps) + ' €/MWh. ';
        t += pb > ps ? 'You buy when your plants are idle, and so is everyone else’s. You sell when everyone has too much.' : 'This year you bought cheaper than you sold.';
      } else if (pb != null) t = 'You bought ' + f(L.boughtMwh / 1000) + ' GWh at ' + f(pb) + ' €/MWh, mostly when your plants and everyone else’s were idle.';
      else t = 'You sold ' + f(L.soldMwh / 1000) + ' GWh at ' + f(ps) + ' €/MWh, mostly when everyone else had too much as well.';
      const allow = colocationTerms.exportShare * this.accounts.stats.load;
      if (L.soldMwh > allow * 1.05 && allow > 0) t += ' ' + f((1 - allow / L.soldMwh) * 100) + ' % of what you sent out earned nothing, since the grid only pays for surplus up to a fifth of your yearly use.';
      out.push({ icon: '🔌', text: t });
    }
    if (L.gasMwh > 1) {
      out.push({ icon: '🔥', text: 'Your gas turbine ran ' + f(L.gasHours) + ' hours. Its power cost about ' + f(M.gas.srmc) + ' €/MWh to make, while the market paid ' + f(L.gasPrice / L.gasMwh) + ' €/MWh in those hours.' });
    }
    return out;
  }

  // Everything the remarks need, in one place.
  yearFacts(s, M, total, matched) {
    const b = this.accounts, st = b.stats, c = this.cfg();
    return {
      total, matched, st,
      builds: st.builds, full: b.rentedRacks >= colocationTerms.rackCount, fullAt: st.fullAt,
      mw: colocationTerms.rackMW * b.rentedRacks, joined: st.joined,
      throttled: st.throttledHours, departures: st.departures,
      gasKt: st.gas * M.gas.co2 / 1000, impShare: st.load > 0 ? st.imported / st.load : 0, impGWh: st.imported / 1000,
      nuclear: c.mw.nuclear > 0, tweets: st.tweets, tweetRacks: st.tweets * 3, cookouts: st.cookouts,
      fines: st.fines || 0, shutdowns: st.shutdowns || 0,
      enStays: !!s.en && s.en.left == null, enLeft: !!s.en && s.en.left != null, enCuts: (s.en && s.en.cuts) || 0, leak: !!s.leak
    };
  }

  yearVerdict(who, x) {
    const f = (v, d) => this.fmt(v, d);
    const m = (v) => f(Math.abs(v) / 1e6);
    if (who === 'marta') {
      if (x.gasKt > 50) return 'Our gas plant put out ' + f(x.gasKt) + ' kt of CO2. I have rewritten the sustainability report three times and it still says gas.';
      if (x.matched >= 0.9) return f(x.matched * 100) + ' % of every hour matched with our own clean power. I am putting it in the sustainability report, and then I am framing the report.';
      if (x.total < 0) return 'We lost ' + m(x.total) + ' M€, but we lost it responsibly. That is the line I am taking to the board.';
      if (x.builds > 0) return 'We grew the hall and kept the neighbours mostly on side. Mostly. I have the minutes.';
      return 'A calm year. Nobody chained themselves to the fence for more than an afternoon.';
    }
    if (who === 'sten') {
      if (x.nuclear) return 'The reactor did exactly what reactors do. I have made a chart about it. It has fourteen tabs.';
      if (x.throttled > 200) return f(x.throttled) + ' hours of power cuts. I did a root-cause analysis. The root cause is the weather, and you.';
      if (x.throttled === 0) return 'Zero hours of power cuts. I have checked the logs twice and I am still suspicious.';
      if (x.total < 0) return 'Technically, everything worked. Financially, that is not my department.';
      return 'The system ran. Some weeks it ran on hope, but it ran.';
    }
    if (who === 'joe') {
      if (x.total > 100e6) return '+' + m(x.total) + ' M€. I have already told the fund it was my idea.';
      if (x.total < 0) return '−' + m(x.total) + ' M€. We will call it an investment phase. Buyers love an investment phase.';
      if (x.full) return 'Every rack rented. That is not a datacenter, that is a story I can sell.';
      if (x.builds === 0) return 'No expansion? I have seen savings accounts with more ambition.';
      return '+' + m(x.total) + ' M€. Respectable. Not exit-respectable, but respectable.';
    }
    if (who === 'al') {
      if (x.full) return this.fmt(x.mw) + ' MW! Next year, a gigawatt. I have already posted about it.';
      if (x.tweets >= 2) return 'I posted ' + x.tweets + ' times. The customers came because of the posts. Do not check that.';
      if (x.builds === 0) return 'No expansion? I have posted that we expanded. Please do not fact-check me.';
      if (x.throttled > 100) return f(x.throttled) + ' hours of power cuts. I told the customers it was a feature. They filed it as a bug.';
      return f(x.mw) + ' MW of pure AI. The future is here, and it needs a bigger hall.';
    }
    return 'Another year in the books. The board has questions.';
  }

  yearTitle(x) {
    if (x.shutdowns > 0) return ['Fence Inspector', 'The protesters got in. You now know every post of that fence by name.'];
    if (x.full && x.throttled < 50) return ['Hyperscaler', 'Every rack rented, and the lights stayed on.'];
    if (x.enStays && !x.enCuts) return ['Landlord to the Mysterious', 'One tenant, many racks, no questions asked.'];
    if (x.matched >= 0.95) return ['Hour-by-Hour Purist', 'Your own clean power, nearly every hour of the year.'];
    if (x.gasKt > 100) return ['Gas Baron', 'Reliable, warm and visible from space.'];
    if (x.impShare > 0.4) return ['Grid Lodger', 'The grid did the heavy lifting. Your neighbours got the invoice.'];
    if (x.throttled > 300) return ['Toaster Operator', 'Your compute came and went with the wind.'];
    if (x.tweets >= 3) return ['Thought Leader', 'Investors read every post. So did everyone else.'];
    if (x.total < 0) return ['Patient Capital', 'The money is gone, but the hall is very nice.'];
    if (x.builds === 0) return ['Careful Custodian', 'The hall never grew. Nothing broke, either.'];
    return ['Steady Operator', 'No headlines. In this business that is a compliment.'];
  }

  yearRemarks(s, x) {
    const f = (v, d) => this.fmt(v, d);
    const out = [];
    const add = (cond, icon, text) => { if (cond && out.length < 4) out.push({ icon, text }); };
    add(x.full && !!x.fullAt, '🏗️', 'Every rack rented by ' + x.fullAt + '. The board sent a fruit basket and a plan for phase 3.');
    add(x.builds > 0 && !x.full, '🏗️', 'You expanded the hall ' + (x.builds === 1 ? 'once' : x.builds + ' times') + '. The crane driver now waves to the protesters, and they wave back.');
    add(x.joined >= 6, '🖥️', f(x.joined) + ' new customers moved in. Each one asked about the power first.');
    add(x.departures === 1, '📦', 'One customer moved out and left a review: great views, unreliable compute.');
    add(x.departures > 1, '📦', f(x.departures) + ' customers moved out. One left a review: great views, unreliable compute.');
    add(x.throttled === 0 && s.char !== 'sten', '✅', 'Not one hour of power cuts. The customers stopped checking the dashboard, which is the highest compliment in this business.');
    add(x.impShare > 0.3, '🔌', f(x.impGWh) + ' GWh came from the grid. Somewhere in Västerås, a heat pump paid for your AI.');
    add(x.gasKt > 30 && s.char !== 'marta', '🔥', 'The gas plant put out ' + f(x.gasKt) + ' kt of CO2. The activists bought it a birthday cake.');
    add(x.cookouts > 0, '🌭', (x.cookouts === 1 ? 'One cookout' : f(x.cookouts) + ' cookouts') + ' and roughly ' + f(x.cookouts * 400) + ' sausages. The protest now has a catering committee.');
    add(x.tweets > 0 && s.char !== 'al', '𝕏', 'Al posted ' + f(x.tweets) + (x.tweets === 1 ? ' time' : ' times') + '. Investors loved every post. Nobody else did.');
    add(x.fines > 0, '⚖️', f(x.fines / 1e6) + ' M€ in fines. The authorities bought a second coffee machine.');
    add(x.enStays && !x.enCuts, '🍸', 'Epistemic Noise still rents its racks. Nobody has seen what runs on them. The power bill suggests they are thinking very hard.');
    add(x.enLeft, '🚪', 'Epistemic Noise took over your customers, then handed the racks back piece by piece. The lunch was nice, though.');
    add(x.enCuts > 0 && !x.enLeft, '🍸', 'Epistemic Noise cut back ' + (x.enCuts === 1 ? 'once' : x.enCuts + ' times') + ' and is still in there, thinking very hard.');
    add(x.leak, '💧', 'ShiftCloud leaked your data. You read about it in the news, like everyone else.');
    add(x.builds === 0, '🌱', 'The hall never grew. Nobody can say you overbuilt.');
    if (out.length < 2) out.push({ icon: '🌦️', text: 'The weather will be different next year, and so will your excuses.' });
    return out;
  }

  renderVals() {
    const M = this.meta();
    const c = this.cfg();
    const s = this.state || {};
    const data = s.data;
    const set = (p) => this.setState(p);
    const openDetail = (kind, tab) => {
      this.stop();
      set({ modal: { kind, tab }, resume: !!s.playing, playing: false });
    };
    const n = 8760;
    const hour = s.hour == null ? 12 : s.hour;
    const dt = this.dateOf(hour, M);
    const season = this.season(dt.mi);

      const yv = (v) => 6 + 150 - Math.min(1, Math.max(0, v) / 1000) * 150;
      const local = (h) => r.load[h] - r.uns[h] - r.imp[h];
      const mid = {
        sold: (h) => r.load[h] + r.exp[h] / 2,
        bought: (h) => local(h) + r.imp[h] / 2,
        gas: (h) => r.gen.nuclear[h] + r.gen.onwind[h] + r.gen.offwind[h] + r.gen.solar[h] + r.dis[h] + r.gas[h] / 2,
        nuclear: (h) => r.gen.nuclear[h] / 2,
        fuel: (h) => r.gas[h] > 1 ? r.gen.nuclear[h] + r.gen.onwind[h] + r.gen.offwind[h] + r.gen.solar[h] + r.dis[h] + r.gas[h] / 2 : r.gen.nuclear[h] / 2
      };
      const dot = { sold: '', bought: '', fuel: '', gas: 'background: #8a7666', nuclear: 'background: #7a6a8c' };
      // marks stay at their hour; a mark whose week has scrolled away is dropped
      const placed = p.items.filter((it) => xh(it.at) >= 0 && xh(it.at) <= 360).map((it, i) => ({ it, i,
        x: Math.min(93, Math.max(7, xh(it.at) / 3.6)), y: Math.min(76, Math.max(16, yv(mid[it.k](it.at)) / 1.6)) }));
      placed.sort((a, b) => a.x - b.x);
      // marks close to each other are stacked upwards so they do not overlap
      placed.forEach((q, j) => { if (j && q.x - placed[j - 1].x < 12 && Math.abs(q.y - placed[j - 1].y) < 22) q.y = Math.max(12, placed[j - 1].y - 24); });
      out.pop = { items: placed.map(({ it, i, x, y }) => ({
        style: 'left: ' + x.toFixed(1) + '%; top: ' + y.toFixed(1) + '%; animation-delay: ' + (i * 0.25).toFixed(2) + 's',
        cls: it.v < 0 ? 'mp loss' : 'mp', label: it.k === 'sold' || it.k === 'bought' ? '' : it.label, val: (it.v < 0 ? '−' : '+') + fmt(it.v), dot: dot[it.k], icls: it.k === 'sold' || it.k === 'bought' ? 'mbolt' : it.k === 'fuel' ? 'mflame' : '' })) };
    }
    out.topLabel = '1,000 MW';
    out.overview = d.overview;
    out.ovLoad = d.ovLoad;
    out.ovImp = d.ovImp;
    {
      // When capacity changes, blend the old and the new curves over half a second instead of jumping.
      const now = performance.now();
      const shown = () => ({ p: Object.assign({}, out.chart.paths), ov: out.overview, ovImp: out.ovImp, ovLoad: out.ovLoad, start: startF });
      if (this._twKey !== undefined && this._twKey !== d.key && this._twShown && this._twShown.start === startF) {
        const calm = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!calm) this._tw = { from: this._twShown, t0: now };
      }
      this._twKey = d.key;
      if (this._tw) {
        const e = (now - this._tw.t0) / 500;
        if (e >= 1) this._tw = null;
        else {
          const t = 1 - Math.pow(1 - e, 3), f = this._tw.from;
          const num = /-?\d+(?:\.\d+)?/g;
          const lerp = (a, b) => {
            if (!a || !b || a.replace(num, '#') !== b.replace(num, '#')) return b;
            const na = a.match(num) || [];
            let i = 0;
            return b.replace(num, (m) => { const v = +na[i++] + (m - na[i - 1]) * t; return v.toFixed(1); });
          };
          for (const k in out.chart.paths) out.chart.paths[k] = lerp(f.p[k], out.chart.paths[k]);
          out.overview = lerp(f.ov, out.overview); out.ovImp = lerp(f.ovImp, out.ovImp); out.ovLoad = lerp(f.ovLoad, out.ovLoad);
          requestAnimationFrame(() => this.setState({}));
        }
      }
      this._twShown = shown();
    }
    out.winX = ((startF * 360) / (n - 1)).toFixed(1);
    out.winW = (((M.win - 1) * 360) / (n - 1)).toFixed(1);
    {
      const wx = (startF * 360) / (n - 1), ww = ((M.win - 1) * 360) / (n - 1);
      out.zoomPts = wx.toFixed(1) + ',0 ' + (wx + ww).toFixed(1) + ',0 360,14 0,14';
    }
    const days = [];
    for (let dd = Math.floor(startF / 24); dd * 24 <= startF + M.win; dd++) {
      const c12 = dd * 24 + 12;
      const xp = ((c12 - startF) / (M.win - 1)) * 100;
      if (xp < -6 || xp > 106 || dd > 364) continue;
      days.push({ label: this.dateOf(dd * 24, M).label, left: 'left: ' + xp.toFixed(2) + '%', cls: dd === Math.floor(hourF / 24) ? 'dl on' : 'dl' });
    }
    out.days = days;
    out.ovX = ((hour * 360) / (n - 1)).toFixed(1);
    return out;
  }
}
window.__dcStart(Component);
